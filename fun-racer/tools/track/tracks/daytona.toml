# Daytona International Speedway (Daytona Beach, Florida, USA): the road course of the Rolex 24,
# 5729 m, 12 turns, anticlockwise. Endurance series (calendar_endurance.json).
#
#   .venv/bin/python tools/track/build_track.py daytona --plot

id = "daytona"
series = "endurance"
full_name = "Daytona International Speedway (road course)"

[osm]
# No type=circuit relation. The bounding box holds the oval, the infield roads, the Le Mans
# chicane, the 2021 NASCAR chicane, motorcycle variants, pit lanes and two kart tracks, so the
# 24 h lap is listed by hand in driving order (about 5754 m, official 5729 m):
ways = [
  352696267,    # from the start / finish area (end of the tri-oval) into the infield, towards T3
  352104911,    # "International Horseshoe" (the inner duplicate 198465563 is left out)
  352104914,    # infield diagonal back to the south west
  1315971773,   # "Dogleg"
  352070313,    # infield, to the west horseshoe
  352104912,    # "West Horseshoe" (the duplicate 198465566 is left out)
  352070310,    # infield link towards the oval
  352070308,    # infield exit onto the oval, just before the south banking
  352067004,    # oval turns 1-2: the south banking and the start of the back straight
  352070311,    # back straight
  198466856,    # "Le Mans Chicane" = the Bus Stop (352070309 is the straight bypass of it)
  352070316,    # "Speedway": north banking (turns 3-4) and the tri-oval, to the finish
]

[layout]
direction = "anticlockwise"
# OSM has no start / finish node: the end of the "Speedway" way, where the pit lane joins the
# tri-oval (estimate; the real line is a little further along the pit wall). Esri World Imagery
# z19 (stitched, tiles 144065-144071 / 217667-217673) shows no painted line on the tri-oval
# (no chequer, only the yellow inner line and pit-entry markings), so it is NOT conclusive and
# the estimate is kept.
finish = [29.18508, -81.074]

[elevation]
dataset = "terrarium"

[road]
# Real banking: 31 degrees (0.54 rad) in the oval turns, 18 (0.31) on the tri-oval; the back
# straight's 2-3 degrees is left to the automatic crossfall. All left-handers: the right edge is
# higher (negative bank). Blends of 110 m (twist rule: >= 1.5 x 0.54 / 0.012 = 68 m) because
# these are 300 km/h corners. s values are read off track.json.
max_bank = 0.56
# Widths (estimates, not surveyed): the infield roads are 12-15 m (13 m as built); the oval's
# banked racing surface is far wider than the "40 ft" quoted for NASCAR's racing groove: about
# 18 m on the turns and the tri-oval (three to four cars abreast on the banking plus the paved
# apron and the run to the wall), so those stretches are widened to 18 m.
base_width = 13.0
grid_width = 18.0

[[road.override]]           # oval turns 1-2 (south banking), 31 deg
s = [2200.0, 2800.0]
bank = -0.54
blend = 110.0

[[road.override]]           # oval turns 3-4 (north banking), 31 deg
s = [4000.0, 4800.0]
bank = -0.54
blend = 110.0

[[road.override]]           # tri-oval before the line, 18 deg
s = [5260.0, 5700.0]
bank = -0.31
blend = 90.0

[[road.override]]           # oval turns 1-2 and the back straight's entry: full oval width
s = [2150.0, 2850.0]
width = 18.0
blend = 60.0

[[road.override]]           # back straight (oval, 3 deg): a little narrower
s = [2900.0, 3350.0]
width = 16.0
blend = 60.0

[[road.override]]           # oval turns 3-4
s = [3950.0, 4900.0]
width = 18.0
blend = 60.0

[[road.override]]           # tri-oval and the start / finish straight
s = [5200.0, 40.0]
width = 18.0
blend = 50.0

