# The main grandstand is mapped as one outline that also holds the voestalpine wing behind
# it, so the stand would get seat rows 40 m deep. It is rebuilt as two straight stands of
# its real depth (about 15 m) under a roof; the wing is a landmark model (landmarks.json).
[[surroundings.exclude]]
osm = "way/312030921"

# Village and farmyard areas (landuse=residential / farmyard) are painted as paved ground,
# which turns Spielberg, Schoenberg and the farms into grey slabs. They are houses in gardens
