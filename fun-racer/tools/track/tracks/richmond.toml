# Richmond, Virginia, USA: 0.75-mile D-shaped short track (1207 m), 4 turns, anticlockwise.
# Built for the stock car / IndyCar calendars (their events link it with "track"): series
# "circuit" keeps it out of every series list on its own.
#
#   .venv/bin/python tools/track/build_track.py richmond --plot

id = "richmond"
series = "circuit"
name = "Richmond"
grand_prix = "Richmond"
country = "United States"
country_code = "US"
city = "Richmond"
length_m = 1207
turns = 4
full_name = "Richmond 0.75-mile oval"

[osm]
ways = [452377300]   # the oval, one closed way (1180 m); pit road 452377296 left out

[layout]
direction = "anticlockwise"
# Finish line: middle of the D-shaped front stretch (the pit road side, south).
finish = [37.591102, -77.419404]

[elevation]
dataset = "terrarium"
# An oval's racing surface is close to level all round; the DEM's few metres of tilt and noise
# (stands, the infield, the banking itself) would become a slope across the oval, so the
# profile is smoothed over most of a lap.
smooth_sigma_m = 400.0

[road]
# Real banking (Virginia): turns 14 degrees; front stretch 8, backstretch 2 degrees. All left-handers, so
# the right (outer) edge is higher: negative bank. A full table (bank_keys, smoothstep between
# keys): the full turn angle from just inside the turn entry to just before its exit, the straight's
# own angle at the middle of each straight, so the road rolls over half a straight
# (steepest roll 0.0020 rad/m, limit 0.012). s values from the centreline (track.json).
max_bank = 0.254
# Width: about 60 ft with the apron; 18 m.
base_width = 18.0
grid_width = 18.0
bank_keys = [
  [38.9, -0.1396, "front stretch"],
  [251.2, -0.2443, "turn 1 entry"],
  [483.2, -0.2443, "turn 2 exit"],
  [641.3, -0.0349, "backstretch"],
  [799.6, -0.2443, "turn 3 entry"],
  [1033.4, -0.2443, "turn 4 exit"],
]

# Pinned: an oval has 4 turns (the two halves of each end), whatever the tri-oval kink does.
[[turn]]
id = "T1"
name = "Turn 1"
direction = "left"
s = 312.0

[[turn]]
id = "T2"
name = "Turn 2"
direction = "left"
s = 422.4

[[turn]]
id = "T3"
name = "Turn 3"
direction = "left"
s = 860.9

[[turn]]
id = "T4"
name = "Turn 4"
direction = "left"
s = 972.1

