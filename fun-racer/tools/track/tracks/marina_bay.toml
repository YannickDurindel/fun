[surroundings]
# The first bake was the largest of all tracks (16 MB, 226,000 triangles): 2.6 x 2.0 km of
# city in full detail and every block of 25 m and more out to 3 km. From the road one sees the
# first row of buildings and the towers above it, so the detail stops 250 m from the lap, and
# the skyline is kept where the lap looks at it: the towers of Marina Centre and the Civic
# District, the financial district across the river, Marina Bay Sands and Marina South. The
# housing estates to the north and west (Bugis, Rochor, Orchard, River Valley) stand behind
# those rows and are left out. (far_margin_m stays at its default: the cached map answer is
# named after it.)
margin_m = 250
tree_species = "broadleaved"

[[surroundings.exclude]]    # west of Fort Canning and Chinatown (x < -2500 m); not the coast (z > 2000 m)
polygon = [[1.2727, 103.7900], [1.3450, 103.7900], [1.3450, 103.8420], [1.2727, 103.8420]]

[[surroundings.exclude]]    # north of Bugis and Kampong Glam (z < -1500 m)
polygon = [[1.3039, 103.8420], [1.3450, 103.8420], [1.3450, 103.9100], [1.3039, 103.9100]]

[[surroundings.building]]   # NS Square: a building site since the Float was pulled down in 2023,
osm = "way/1492514975"      # not the finished arena the map already draws
remove = true

[[surroundings.building]]   # Singtel Waterfront Theatre (2022): three storeys with a fly tower,
osm = "way/692103122"       # about 15 m (estimate from photographs); the bake guessed 6 m
height = 15.0

