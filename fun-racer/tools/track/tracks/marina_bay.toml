# Marina Bay Street Circuit, Singapore: the layout raced since 2023 (19 turns, anticlockwise),
# without the four corners under the Float grandstand.
#
#   .venv/bin/python tools/track/build_track.py marina_bay --offline

id = "marina_bay"
# Official lap length since 2025: 4.927 km (formula1.com race page of the 2025 Singapore Grand
# Prix: 4.927 km, 62 laps, 305.337 km). The same layout was listed at 4.940 km in 2023 and 2024
# (Wikipedia, "Marina Bay Street Circuit", layout table); assets/tracks/calendar.json still
# carries that figure.
length_m = 4927

[osm]
# type=circuit relation "Marina Bay Street Circuit": one closed loop of 99 ways, 4972 m in OSM
# (+0.9 % on the official 4927 m), so it is the post-2023 layout: the run from Turn 15 to
# Turn 16 is one straight. Public roads (Republic and Raffles Boulevard, Nicoll Highway,
# Stamford Road, St Andrew's Road, Connaught Drive, Fullerton Road, Esplanade Drive, Raffles
# Avenue) and the permanent raceway pieces around the pit building. A node has the role
# "finish" and another "start", 137 m further on: the official race distance (305.337 km for
# 62 laps of 4.927 km) gives the same 137 m offset.
relation = 421263
ignore_oneway = true      # the ways carry traffic oneway tags, which no loop follows

# The roads are drawn as road centrelines, so where the lap turns at a junction the loop has
# one sharp vertex (or a knot of them a few metres apart), and a 13 m wide road cannot follow
# it: the mesh folds at Turn 11 and at the hairpin. These entries replace each vertex by a
# corner of a plausible radius. The radii are estimates, not surveyed.
# They also shorten the loop: 4896 m after rounding (-0.63 % on the official length), so the
# plan view is scaled up by 0.6 %. A larger reach_m makes that worse.
[[osm.round]]
node = 172510077        # Raffles Boulevard -> Nicoll Highway: one 89 degree vertex
reach_m = 21.0
note = "Turn 7, Memorial"

[[osm.round]]
node = 233879753        # Nicoll Highway -> Stamford Road: one 112 degree vertex
reach_m = 27.0
note = "Turn 8"

[[osm.round]]
node = 6856578455       # St Andrew's Road -> Connaught Drive: 60 + 13 degrees in 5 m
reach_m = 21.0
note = "Turn 10, where the Singapore Sling chicane was until 2012"

[[osm.round]]
node = 4451336947       # Connaught Drive -> Fullerton Road: 16 R, 22 L, 22 L, 86 R in 11 m
reach_m = 16.0
note = "Turn 11"

[[osm.round]]
node = 9569954754       # Fullerton Road -> Esplanade Drive: 64 + 14 + 53 degrees in 9 m
reach_m = 36.0
note = "Turn 13, the hairpin"

[[osm.round]]
node = 233879421        # Esplanade Drive -> Raffles Avenue: one 112 degree vertex
reach_m = 27.0
note = "Turn 14"

[layout]
direction = "anticlockwise"

[elevation]
dataset = "terrarium"
# The circuit is on flat reclaimed land, a few metres above the bay. The elevation data is a
# surface model of a city centre: along the lap it reads -16 to +37 m (hotel towers, the
# grandstands, the water under the Anderson and Esplanade bridges). None of that is the road,
# so the profile is smoothed until only a slow drift is left, and then replaced by the keys
# below.
smooth_sigma_m = 1000.0

# What is left after that smoothing is still not the road, so the whole profile is declared:
# every key is joined to the one before it, and the lap follows one curve through them.
# Published: 5.3 m of elevation change over the lap (formula1.com, "Highs and lows: which F1
# track has the most elevation changes?", 2016). The circuit is level streets on reclaimed
# land about 3 m above the water, and the two bridges over the Singapore River, which the
# drivers know as the bumps of the lap. The heights of the keys are ESTIMATES that add up to
# the published range: the Esplanade Bridge is the high point (a low arch bridge, 261 m long,
# with room for the river boats under its middle spans), Raffles Avenue beside the bay the low
# one, and the Anderson Bridge a hump of about a metre on a 70 m deck.
# abs of the first key: the flattened terrain (see [terrain]) stands at about 10.9 m in the
# surface model's datum where the lap meets the river, and stands for the water there; the
# streets are 3 m above it.
[[elevation.key]]
s = 0.0
abs = 13.5
join = true
note = "finish line, pit straight"

[[elevation.key]]
s = 2400.0
y = 0.3
join = true
note = "St Andrew's Road at the Padang"

[[elevation.key]]
s = 2880.0
y = 0.3
join = true
note = "Fullerton Road, north end of the Anderson Bridge"

[[elevation.key]]
s = 2960.0
y = 1.4
join = true
note = "crown of the Anderson Bridge (deck from s = 2925 to 2996)"

[[elevation.key]]
s = 3030.0
y = 0.3
join = true
note = "Fullerton Road at the Fullerton Hotel"

[[elevation.key]]
s = 3085.0
y = 0.3
join = true
note = "exit of the hairpin, south end of the Esplanade Bridge"

[[elevation.key]]
s = 3220.0
y = 4.5
join = true
note = "crown of the Esplanade Bridge: the highest point of the lap"

[[elevation.key]]
s = 3365.0
y = 0.2
join = true
note = "north end of the Esplanade Bridge, in front of the Esplanade theatres"

[[elevation.key]]
s = 3600.0
y = 0.0
join = true
note = "Turn 14"

[[elevation.key]]
s = 3900.0
y = -0.8
join = true
note = "Raffles Avenue beside the bay: the lowest point of the lap"

[[elevation.key]]
s = 4300.0
y = -0.8
join = true
note = "braking for Turn 16"

[[elevation.key]]
s = 4720.0
y = 0.0
join = true
note = "Turn 18"

[terrain]
# Same reason: unsmoothed, every tower block is a hill beside the road, and even at 500 m the
# "ground" still fell 19 m over 2.6 km towards the bay, with the water lying in steps on that
# slope. The real ground is level reclaimed land, so the surface model is smoothed away
# altogether: what is left is one level, which stands for the water of the bay, and the road
# is keyed above it ([[elevation.key]] below).
smooth_sigma_m = 10000.0

[road]
# Full width between the white lines, metres. No width is published for this circuit (the FIA
# circuit licence is not public, and the organiser's pages give none), so every figure here is
# an ESTIMATE: the number of lanes of the carriageway the lap uses (OpenStreetMap `lanes` of
# the loop's ways, listed per key) times 3.3 m, the usual lane on these Singapore roads, less
# what the concrete blocks standing on the tarmac take; the purpose-built stretches round the
# pit building from the aerial view. Two anchors: the Anderson Bridge, where the lap has used
# the left half of the deck, one two-lane bay between the steel arches, since 2015
# (racingcircuits.info: "drivers now enter the left lane of Anderson Bridge"), and the
# Turn 13 hairpin, "widened by a metre" that year (same page).
width_keys = [
  [0.0, 14.0, "pit straight and grid: purpose-built, about four lanes"],
  [400.0, 14.0, "braking for Turn 1"],
  [450.0, 12.5, "Turn 1 Sheares"],
  [520.0, 11.5, "Turns 2 and 3: purpose-built esses under the Benjamin Sheares Bridge"],
  [620.0, 11.5, ""],
  [680.0, 11.0, "Republic Boulevard: one three-lane carriageway"],
  [930.0, 11.0, ""],
  [990.0, 12.5, "Turn 5 onto Raffles Boulevard"],
  [1090.0, 15.0, "Raffles Boulevard: 4 to 6 lanes, one way (the widest road of the lap)"],
  [1760.0, 15.0, "braking for Turn 7"],
  [1830.0, 13.5, "Turn 7 Memorial onto Nicoll Highway: 4 lanes"],
  [2000.0, 13.5, ""],
  [2050.0, 13.0, "Turn 8 onto Stamford Road: 4 lanes"],
  [2190.0, 13.0, ""],
  [2240.0, 13.0, "Turn 9 onto St Andrew's Road: 4 lanes past the Padang"],
  [2560.0, 13.0, ""],
  [2660.0, 10.5, "St Andrew's Road narrows to 2 lanes before Turn 10"],
  [2710.0, 9.5, "Connaught Drive: 2 lanes and a parking strip"],
  [2800.0, 9.5, ""],
  [2850.0, 8.5, "Turn 11 and Turn 12: Fullerton Road onto the Anderson Bridge"],
  [2905.0, 8.0, "Anderson Bridge: one two-lane bay between the arches (the narrowest point)"],
  [2960.0, 8.0, ""],
  [3010.0, 10.5, "Fullerton Road past the Fullerton Hotel"],
  [3050.0, 11.5, "Turn 13 hairpin, widened by a metre in 2015"],
  [3090.0, 11.5, ""],
  [3150.0, 14.0, "Esplanade Drive and Esplanade Bridge: one four-lane carriageway"],
  [3570.0, 14.0, ""],
  [3620.0, 14.0, "Turn 14 onto Raffles Avenue"],
  [3700.0, 15.0, "Raffles Avenue: 4 to 6 lanes"],
  [4300.0, 15.0, "braking for Turn 16"],
  [4360.0, 12.5, "Turn 16 and Turn 17 under the Benjamin Sheares Bridge"],
  [4440.0, 12.0, "purpose-built run past the Singapore Flyer"],
  [4690.0, 12.0, ""],
  [4760.0, 13.0, "Turns 18 and 19 onto the pit straight"],
  [4860.0, 14.0, ""],
]

# The official 19 turns, pinned. Automatic detection finds 21: it also numbers the gentle
