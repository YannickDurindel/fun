# Martinsville, Virginia, USA: 0.526-mile paperclip short track (847 m), 4 turns, anticlockwise.
# Built for the stock car / IndyCar calendars (their events link it with "track"): series
# "circuit" keeps it out of every series list on its own.
#
#   .venv/bin/python tools/track/build_track.py martinsville --plot

id = "martinsville"
series = "circuit"
name = "Martinsville"
grand_prix = "Martinsville"
country = "United States"
country_code = "US"
city = "Ridgeway"
length_m = 847
turns = 4
full_name = "Martinsville 0.526-mile oval"

[osm]
ways = [448515177, 402168721, 448515178]   # the oval (827 m); "Pit Road" 402168723 left out

[layout]
direction = "anticlockwise"
# Finish line: middle of the west straight: the main gate is on the west side, and OSM places the backstretch camping area and the backstretch Bill France Tower on the east side.
finish = [36.634231, -79.852237]

[elevation]
dataset = "terrarium"
# An oval's racing surface is close to level all round; the DEM's few metres of tilt and noise
# (stands, the infield, the banking itself) would become a slope across the oval, so the
# profile is smoothed over most of a lap.
smooth_sigma_m = 400.0

[road]
# Real banking (Virginia): turns 12 degrees; flat straights (the automatic 1.5 % crossfall is not used: the table holds 0). All left-handers, so
# the right (outer) edge is higher: negative bank. A full table (bank_keys, smoothstep between
# keys): the full turn angle from just inside the turn entry to just before its exit, the straight's
# own angle at the middle of each straight, so the road rolls over half a straight
# (steepest roll 0.0023 rad/m, limit 0.012). s values from the centreline (track.json).
max_bank = 0.219
# Width: 55 ft straights, wider in the turns; 16 m.
base_width = 16.0
grid_width = 16.0
bank_keys = [
  [0.0, -0.0000, "front stretch"],
  [137.0, -0.2094, "turn 1 entry"],
  [283.4, -0.2094, "turn 2 exit"],
  [421.4, -0.0000, "backstretch"],
  [559.8, -0.2094, "turn 3 entry"],
  [709.7, -0.2094, "turn 4 exit"],
]

# Pinned: an oval has 4 turns (the two halves of each end), whatever the tri-oval kink does.
[[turn]]
id = "T1"
name = "Turn 1"
direction = "left"
s = 175.3

[[turn]]
id = "T2"
name = "Turn 2"
direction = "left"
s = 245.1

[[turn]]
id = "T3"
name = "Turn 3"
direction = "left"
s = 599.1

[[turn]]
id = "T4"
name = "Turn 4"
direction = "left"
s = 670.4

