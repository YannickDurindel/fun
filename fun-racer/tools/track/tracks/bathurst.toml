# Mount Panorama Circuit, Bathurst NSW, Australia: 6213 m, 23 turns, anticlockwise. Endurance
# series (calendar_endurance.json).
#
#   .venv/bin/python tools/track/build_track.py bathurst --plot

id = "bathurst"
series = "endurance"

[osm]
# No type=circuit relation found; the lap is a public road (highway=residential / tertiary,
# no oneway tags) listed by hand in driving order, Chase chicane on Conrod Straight included
# (current layout). Sum of the ways: about 6185 m against 6213 m official.
ignore_oneway = true
ways = [
  414156373,    # Murrays Corner -> Pit Straight link
  306192512,    # Pit Straight
  1115461019,   # Hell Corner (Turn 1)
  414156370,    # Hell Corner
  30111085,     # Mountain Straight
  30111102,     # Griffins Bend
  306192500,    # The Cutting
  306192503,    # Reid Park
  414156376,    # Sulman Park
  306192504,    # McPhillamy Park
  414156366,    # Brocks Skyline
  306192501,    # The Esses
  306192502,    # Forrest's Elbow
  30111107,     # Conrod Straight
  306192513,    # The Chase
  306192514,    # Conrod Straight (second half)
  306192511,    # Murrays Corner
]

[layout]
direction = "anticlockwise"
# OSM has no start / finish node (no raceway=* feature within 400 m). Esri World Imagery (z18;
# z19 is "map data not yet available" here): the line is under the pedestrian / timing bridge
# that crosses the pit straight at the pit building (race control). The paint itself is hidden
# by the bridge and its shadow, so the position is the bridge centre line, about 5.7 m behind
# the earlier node-based estimate (-33.4394894, 149.5598428); accuracy about 3 m.
finish = [-33.4394894, 149.5597816]

[elevation]
dataset = "terrarium"

# Turn table pinned to the official 23 turns. Numbering anchors found in published guides (none
# is an official map; none gives all 23): Supercars "How Bathurst 1000 corners got their names"
# (supercars.com, 2025: Hell Corner left, Turn 2 = Griffins Bend uphill right, Turn 4 = The
# Cutting), Virtual Race Car Engineer and a Steam setup guide (T1 Hell Corner, T9 Sulman Park,
# T18 The Dipper, T19 Forrest's Elbow, T20 the fast kink before the Chase, T21 / T22 the Chase
# left / right, Murray's Corner last), a track guide that puts the Esses at T13-T17.
# The OSM geometry resolves 22 corners; T11 is the weak right kink on Skyline (R ~ 1.4 km) that
# fills the count to 23 (OSM draws Skyline almost straight), so T10..T17 names are a best fit,
# not confirmed: T11-T12 and the Dipper direction (guides say left, the geometry has a right at
# s 3764 before Forrest's Elbow) are uncertain. The slight right at s 5241 (R 128 m) is not
# counted (T21 is a left per the guides).
[[turn]]
id = "T1"
name = "Hell Corner"
direction = "left"
s = 388.8

[[turn]]
id = "T2"
name = "Griffins Bend"
direction = "right"
s = 1489.1

