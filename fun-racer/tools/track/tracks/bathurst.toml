# A footpath tagged bridge=yes is drawn as a straight deck between its ends: the Skyline /
# Esses walking paths (265, 102, 51 and 27 m long) hang in the air over the mountainside.
[[surroundings.exclude]]
osm = "way/842363811"
[[surroundings.exclude]]
osm = "way/842363809"
[[surroundings.exclude]]
osm = "way/842363822"
[[surroundings.exclude]]
osm = "way/842363801"

# Pit-straight pedestrian / timing bridge (OSM footway 791554959 with steps 37594859 /
# 791554958): the automatic deck came out as a huge inverted cone over the start line, so the
# three ways are excluded and the bridge is redrawn: a 3.5 m deck 6 to 7 m above the road
# (clears the cars by >= 6 m) between two stair / lift towers, on the OSM footway line.
[[surroundings.exclude]]
osm = "way/791554959"
[[surroundings.exclude]]
osm = "way/37594859"
[[surroundings.exclude]]
osm = "way/791554958"

