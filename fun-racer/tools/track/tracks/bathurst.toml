[road]
retaining_walls = true    # hillside circuit
# Widths: ESTIMATES. OSM has no width tags on these ways; the public-road sections of Mount
# Panorama are known to be narrow on the mountain (about 8 to 10 m between the white lines,
# Skyline / the Esses / the Dipper the narrowest), wider on Conrod Straight and the pit
# straight (Supercars / Bathurst 12 Hour track notes). Not surveyed.
width_keys = [
  [0.0, 15.0, "pit straight (grid)"],
  [250.0, 15.0, ""],
  [370.0, 12.5, "Hell Corner (T1)"],
  [450.0, 11.0, "Mountain Straight, start of the climb"],
  [1450.0, 10.5, "Griffins Bend"],
  [1800.0, 10.0, "The Cutting"],
  [2100.0, 10.0, "Reid Park / Sulman Park"],
