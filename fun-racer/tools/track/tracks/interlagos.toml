  [2000.0, 10.5, ""],
  [2070.0, 12.5, "Ferradura and Laranjinha"],
  [2210.0, 12.5, ""],
  [2270.0, 11.0, ""],
  [2330.0, 11.0, ""],
  [2380.0, 12.0, "the Esse and Pinheirinho"],
  [2570.0, 12.0, ""],
  [2630.0, 11.0, ""],
  [2740.0, 11.0, ""],
  [2785.0, 12.0, "Bico de Pato"],
  [2830.0, 12.0, ""],
  [2875.0, 10.5, ""],
  [2920.0, 10.5, ""],
  [2990.0, 11.5, "Mergulho"],
  [3100.0, 11.5, ""],
  [3160.0, 10.0, "run to Junção"],
  [3230.0, 10.0, ""],
  [3285.0, 12.0, "Junção"],
  [3600.0, 12.5, "Subida do Café"],
  [3700.0, 13.5, "Subida dos Boxes and Arquibancadas"],
  [4150.0, 13.5, ""],
  [4250.0, 14.0, "pit wall begins"],
]

# Banking: Curva do Sol and the long left of the Subida dos Boxes / Arquibancadas are visibly
# banked (drone photographs of 2023 on Wikimedia Commons, "Vista aérea del Autódromo José
# Carlos Pace"); no angle is published. Estimate: 3 to 5 degrees. The road step allows
# 0.03 rad (1.7 degrees) at most, so both get that limit over their whole length instead of
# only around the apex.
[[road.override]]
s = [545.0, 715.0]
bank = -0.03
blend = 40.0
note = "Curva do Sol, banked left"

[[road.override]]
s = [3610.0, 4120.0]
bank = -0.03
blend = 60.0
note = "Subida dos Boxes and Arquibancadas, banked left"

# The official turn table, pinned. Numbers follow the `raceway:corner_number` tags of the OSM
