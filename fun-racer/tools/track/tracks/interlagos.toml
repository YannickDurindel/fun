# Autódromo José Carlos Pace (Interlagos), São Paulo: Grand Prix circuit, anticlockwise.
#
#   .venv/bin/python tools/track/build_track.py interlagos --offline
#   .venv/bin/python tools/track/landmarks/interlagos.py

id = "interlagos"

[osm]
# type=circuit relation of the Grand Prix layout. It leaves out the pit lane, the kart track,
# the drag strip and the motorcycle chicane on the Subida dos Boxes (way 189535481), which a
# bounding-box build would pick up (4335 m with the chicane, 4313 m without). The relation
# also carries the finish line and the start line as members: the grid is 60 m after the
# timing line, as the published race distance (71 laps = 305.879 km = 71 x 4.309 - 0.060) says.
relation = 6781071

[layout]
# OpenStreetMap draws the start straight along its western edge: on the aerial picture (Esri
# World Imagery, 0.55 m per pixel) the tarmac lies 9 to 11 m to the left of the mapped line
# and only 3 m to the right of it from the pit entry to the footbridge before the Senna S,
# while the mapped pit building and grandstands fit the same picture within 2 m. Moved to the
# middle of the road, so the pit wall and the stands are at their real distance. Estimate:
# measured every 10 m, median 3.4 m.
[[layout.shift]]
s = [4150.0, 280.0]
lateral_m = -3.4
blend = 120.0
note = "start straight: the mapped line is the right-hand edge of the road"

[elevation]
# Outside EU-DEM coverage; Terrain Tiles are SRTM-based here.
dataset = "terrarium"

# SRTM is a surface model: beside the concrete terraces of sector A, the roofed stands and the
# pit building it gives the start straight a 4 m hump at s = 3880, a dip at s = 4000 and
# another at s = 4240. The real road climbs without a break from Junção to a crest between the
# start line and the Senna S ("the highest point is on the rise between the start-finish line
# and Turn 1", formula1.com, "Highs and lows", 2016; 33 m from the exit of Junção to the
# braking point of Turn 1, same source: built 33.0 m). The keys keep the heights the model has
# at the foot of the steep ramp (s = 3640), at the line and on the crest, and put a steady
# climb between them. Estimate: no survey of the straight is published.
[[elevation.key]]
s = 3640.0
y = -6.7
note = "top of the 10 % ramp of the Subida dos Boxes (height of the terrain model)"

[[elevation.key]]
s = 3780.0
y = -4.4

[[elevation.key]]
s = 3920.0
y = -2.9

[[elevation.key]]
s = 4060.0
y = -1.7

[[elevation.key]]
s = 4200.0
y = -0.7

[[elevation.key]]
s = 0.0
y = 0.0

[[elevation.key]]
s = 140.0
y = 1.3

[[elevation.key]]
s = 275.0
y = 2.4
note = "crest before the braking zone of the Senna S, the highest point of the lap"

[road]
# Widths: no figure per section is published (the FIA circuit licence list gives none, and
# OpenStreetMap has no width tag on these ways). Estimates, measured between the white lines
# on Esri World Imagery (0.55 m per pixel, so +/- 1 m) every 10 m round the lap. Interlagos is
# narrow: "narrower than the average for Formula 1 circuits" (Scuderia Ferrari, São Paulo
# Grand Prix preview 2025). The previous build had the default 13 m, 15 m on the grid.
width_keys = [
  [0.0, 14.0, "start line and grid (pit wall to the right-hand white line)"],
  [60.0, 14.0, ""],
  [130.0, 12.5, "start straight past the grid"],
