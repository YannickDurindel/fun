# ----------------------------------------------------------------------------------------
# Surroundings. References: Esri World Imagery (aerial picture, 0.55 m per pixel), the drone
# photographs "Vista aérea del Autódromo José Carlos Pace" 01 to 06 and "Topo do S de
# Interlagos" on Wikimedia Commons, and the organiser's grandstand map. Polygons are lat, lon.
#
# The look (assets/tracks/interlagos/environment.json, which cannot carry comments) comes from
# the same pictures: a São Paulo Grand Prix afternoon (early November, lights out at 14:00
# local time = 14:09 solar time at 46.70 W: sun 59 degrees up on bearing 277), the warm haze
# of the city, yellow-green grass with dry patches, red latosol where the ground is bare
# (class "sand"), terracotta tile roofs (the "urban" colours), kerbs in the colours of the
# flag (yellow and blue blocks, green behind), dark green lake water, blue seats in sector G
# and bare concrete steps in sector A.
#
# Landmark models (run-off paint, start gantry, pit roof): tools/track/landmarks/interlagos.py,
# to be run again after every rebuild of the road or the terrain.
[surroundings]
# The circuit lies in a bowl: from the road a driver sees the rim of low houses and, over it,
# only the tower blocks. Houses are built within 330 m of the lap (the far rim of the bowl as
# seen from the start straight); beyond that only buildings of 25 m and more, as everywhere.
# This takes scenery.glb from 12.1 MB to about a third.
margin_m = 330.0
# Atlantic-forest remnants and planted street trees: no conifers.
tree_species = "broadleaved"
# São Paulo's suburbs are houses of two floors (sobrados).
default_levels = 2

# The pit building: garages with the hospitality floor above and the white tensile roof, about
# 11 m from the pit lane to the roof edge (three floors in the drone photographs; the map has
# no height). A height counts from the lowest ground corner of the footprint, and the terrain
# model drops 6 m towards the paddock behind the building (-4.5 m against +1.3 m on the road):
# 16.3 m puts the roof edge 10.5 m above the road, under the roof landmark.
[[surroundings.building]]
osm = 33779114
height = 16.3
note = "pit building"

# Race control and the media centre at the head of the pit lane (five floors, dark glass).
[[surroundings.building]]
osm = 1262374301
height = 19.0
type = "office"
note = "race control tower"

# The paddock building behind the pits ("Prefeitura de São Paulo" on its fascia): four
# terraced floors, about 17 m on its uphill side. Its footprint spans 15 m of slope in the
# terrain model, so the height from the lowest corner is 26 m (estimate).
[[surroundings.building]]
osm = 138433083
height = 26.0
note = "paddock building"

# The bank outside the Senna S is mapped as one building under construction; the stands that
# are built on it for the race are added below.
[[surroundings.building]]
osm = 1563340820
remove = true

