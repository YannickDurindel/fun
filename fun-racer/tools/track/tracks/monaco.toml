[road]
# Widths: nobody publishes them per section (the FIA circuit map gives none, and guides only
# say "8 m at the narrowest, 11 m at the widest"). These are ESTIMATES measured kerb to kerb
# on the IGN aerial photograph (BD ORTHO, 20 cm per pixel, good to about half a metre), which
# is the room the armco leaves the cars: the barriers stand on the kerb line. Where the lap
# crosses open ground (Sainte Devote, the chicane, the quay, the esplanade after the Swimming
# Pool) the barriers alone make the road; there the neighbouring street width is carried on.
base_width = 10.0
grid_width = 12.0
width_keys = [
  [0.0, 12.0, "Boulevard Albert 1er, grid: 12 to 13 m with the parking lanes"],
  [150.0, 12.0, ""],
  [200.0, 10.0, "Sainte Devote: the barriers close the junction down to the width of Avenue d'Ostende"],
  [640.0, 10.0, "Beau Rivage: Avenue d'Ostende, three lanes, 10 to 10.5 m"],
  [700.0, 9.0, "Massenet: Avenue de Monte-Carlo round the Hotel de Paris, 8.5 to 9 m"],
  [840.0, 9.0, ""],
  [870.0, 10.0, "Casino square"],
  [930.0, 10.0, ""],
  [970.0, 8.5, "Avenue des Spelugues down to Mirabeau: two lanes and a parking lane, 8 to 8.5 m"],
  [1100.0, 8.5, ""],
  [1125.0, 8.0, "Mirabeau Haute and the drop to the hairpin: 7.5 to 8 m, the narrowest stretch"],
  [1215.0, 8.0, ""],
  [1300.0, 9.0, "after the hairpin (see the override): 8.5 to 9 m"],
  [1380.0, 9.0, "Mirabeau Bas"],
  [1420.0, 9.0, "Portier"],
  [1455.0, 9.0, ""],
  [1480.0, 11.0, "Boulevard Louis II into the tunnel: four lanes, 12 m between the kerbs; 11 m built, the barriers funnel it into the 10 m tunnel"],
  [1520.0, 11.0, ""],
  [1560.0, 10.0, "tunnel: not visible from above; the road that leaves it is 10 to 10.5 m"],
  [2360.0, 10.0, "chicane and Quai des Etats-Unis"],
  [2380.0, 9.0, "Tabac: 9 m between the quay wall and the kerb"],
  [2405.0, 9.0, ""],
  [2440.0, 10.0, "Quai Albert 1er to the Swimming Pool"],
  [2590.0, 10.0, ""],
  [2615.0, 9.0, "beside the pool: 9 m"],
  [2700.0, 9.0, ""],
  [2740.0, 9.5, "esplanade to La Rascasse"],
  [2900.0, 9.5, ""],
  [2915.0, 10.0, "La Rascasse: really 9 m; built 10 m, see below"],
  [2985.0, 10.0, ""],
  [3005.0, 9.0, "Anthony Noghes: 9 m"],
  [3030.0, 9.0, ""],
  [3090.0, 10.0, "Boulevard Albert 1er after Noghes: 10 m"],
  [3150.0, 12.0, "grid"],
]
# The lap is cut into a hillside: Beau Rivage runs 30 m above the harbour front, and the legs
# of Mirabeau, the hairpin and Portier are 5 to 8 m above each other, 25 m apart.
retaining_walls = true

# Two corners are built wider than they are, because the game's car does not turn as tightly
# as a Formula 1 car on full lock:
#   * the Grand Hotel hairpin (10 m centreline radius), really 9 to 9.5 m wide, is 14 m;
#   * La Rascasse (14 m radius), really 9 m, is 10 m: at 9 m the autopilot runs 0.6 m over
#     the outside line on the exit (lap check, arcade handling).
[[road.override]]
s = [1252.0, 1284.0]
width = 14.0
blend = 25.0

[terrain]
# Ground model too. A light blur takes out the steps of retaining walls and quays, which a
# 10 m mesh cannot show anyway.
smooth_sigma_m = 20.0

# ---------------------------------------------------------------------------------------------
# Surroundings: the town as it stands on a Grand Prix Sunday. The map (OpenStreetMap) gives
# the buildings, the harbour and the gardens; what it lacks is added here. Reference for every
# position: the IGN aerial photograph (BD ORTHO, 20 cm), compared stretch by stretch with the
# built lap; for what the race adds (grandstands, pits), the ACM grandstand plan as described
# by the ticket guides (f1destinations.com, gpdestinations.com, oversteer48.com).
[surroundings]
# Stone pines, palms, plane trees and garden trees: no forest anywhere near the lap.
tree_species = "broadleaved"

# The tunnel runs from the Portier end of the Fairmont hotel (s = 1522) to the portal under
# the Monte Carlo Star gardens (s = 1885): 363 m, read off the aerial photograph (the roofs of
# the hotel and of the Rainier III auditorium cover the road in between). Photographs taken
# inside it in race trim (Wikimedia Commons, "Circuit de Monaco - Tunnel", May 2022) show a
# closed, tiled wall on the outside of the bend (the driver's left, the sea side: the hotel's
# service floors are behind it), a concrete barrier with a walkway on the inside, a flat slab
# and a row of lamps: a closed tube. Only the last stretch before the exit is open towards
# the harbour between columns; its length (55 m) is an ESTIMATE from broadcast pictures of the
# exit, not a surveyed figure. Clear height about 5 m (the same photographs; no published
# figure).
[[surroundings.roof]]
s = [1522.0, 1830.0]
kind = "tunnel"
clear_height = 5.0
note = "tunnel under the Fairmont and the Rainier III auditorium: closed"

[[surroundings.roof]]
s = [1830.0, 1885.0]
kind = "gallery_left"
clear_height = 5.0
note = "tunnel exit: open to the harbour side between columns"

# ---- map features that are not there on race day, or not as mapped
[[surroundings.building]]
osm = "way/1470365896"
remove = true
note = "'Neuehouse' at Portier: an underground level, drawn across the road"

[[surroundings.building]]
osm = "way/432751363"
remove = true
note = "kiosk on the quay, 1.5 m from the centreline at the chicane exit: not there in race trim"

