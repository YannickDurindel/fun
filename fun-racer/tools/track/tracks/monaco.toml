# Circuit de Monaco: the Grand Prix lap on the streets of Monte Carlo and La Condamine
# (3337 m, 19 turns, clockwise).
#
#   .venv/bin/python tools/track/build_track.py monaco --offline

id = "monaco"

[osm]
# type=circuit relation "Circuit de Monaco" (tagged length=3337). The lap runs on public
# streets (highway=secondary / residential / service) joined by short highway=raceway links
# at Sainte Devote, Portier, the Nouvelle Chicane, the Swimming Pool and La Rascasse.
relation = 148194
# The streets' oneway tags follow traffic (Boulevard Albert 1er is driven against it).
ignore_oneway = true
# The relation has a gap at the top of the Beau Rivage climb: the last 18 m of Avenue
# Princesse Alice, between the end of Avenue d'Ostende and the slip road into Avenue de
# Monte-Carlo, is not a member (the way was split off in an edit of August 2026).
extra_ways = [35092475]
# "Sortie des stands", the pit exit lane beside Sainte Devote, is a member without a role.
exclude_ways = [1388331347]
# The slip road is drawn twice (ways 1551240829 and 1551240830, both members): the lap takes
# the direct one, not the 5 m detour over the junction node on Avenue Princesse Alice.
avoid_nodes = [14109303022]

# The slip road leaves Avenue Princesse Alice with a 3 m sideways jog (a 29 and a 42 degree
# vertex 7 m apart). Massenet is one long left-hander.
[[osm.round]]
node = 12571844664
reach_m = 16.0
note = "entry of Massenet"

[layout]
direction = "clockwise"
# The relation's "start-finish" node (raceway=start-finish, "Depart Grand Prix de Monaco") on
# Boulevard Albert 1er. The race distance is 78 full laps (260.286 km), so the grid starts on
# the finish line.
finish = [43.7350269, 7.4212652]

[elevation]
# A terrain model (ground level). The surface models are useless here: with Terrain Tiles the
# hotel and apartment blocks give a 50.8 m range, Sainte Devote 20 m above the start line and
# the harbour front 15 m above the sea.
dataset = "ign"
# The data is clean, so the profile only needs its 1 m steps taken out, not a 45 m blur that
# would flatten the crest in Casino Square and the drop from Mirabeau to Portier.
smooth_sigma_m = 12.0

# Beau Rivage: "the maximum gradient in this part of the circuit is around 12 %" (Wikipedia,
# Circuit de Monaco). The lap-wide 12 m smoothing leaves 10.3 %; the ground model itself is
# kept here, with only its 1 m steps taken out.
[[elevation.smooth]]
s = [250.0, 640.0]
sigma_m = 7.0
blend = 40.0

# The tunnel under the Fairmont hotel and its terraces: the terrain model has the platform
# above (up to 24 m), the road stays at quay level from Portier to the tunnel exit.
[[elevation.override]]
s = [1505.0, 1910.0]
straighten = true
note = "tunnel"

# The 19 official turns. Automatic detection finds 26: it also numbers the slight right where
# the lap leaves Avenue d'Ostende (s = 647), both curvature peaks of Massenet (770, 843), the
# left kink between Mirabeau Haute and the hairpin (1198), the two ends of the tunnel's long
# right-hander (1545, 1946), the left out of the chicane (2162) and two kinks of Boulevard
# Albert 1er before the line (3055, 3137). s = the apex found by the detection; the tunnel
# has no single apex and is pinned in its middle.
[[turn]]
id = "T1"
name = "Sainte Dévote"
direction = "right"
s = 219.8

[[turn]]
id = "T2"
name = "Beau Rivage"
direction = "left"
