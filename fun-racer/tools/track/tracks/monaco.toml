[road]
# Public streets between walls: about 9 to 11 m, and the wider Boulevard Albert 1er with the
# grid. Estimates; OSM has no widths here.
base_width = 10.0
grid_width = 12.0
# track.json keeps one nominal width (the 10 m base) as it did before recipes that set a width
# got the built widths by default. Remove this line when the widths are corrected, so that the
# drivers see the 12 m grid and the widened hairpin.
track_json_widths = false
# The lap is cut into a hillside: Beau Rivage runs 30 m above the harbour front, and the legs
# of Mirabeau, the hairpin and Portier are 5 to 8 m above each other, 25 m apart.
retaining_walls = true

# The Grand Hotel hairpin has a 10 m centreline radius. The real corner is taken on full lock
# from kerb to kerb; the game's car needs more room than a 10 m road gives it.
[[road.override]]
s = [1252.0, 1284.0]
width = 14.0
blend = 25.0

[terrain]
# Ground model too. A light blur takes out the steps of retaining walls and quays, which a
# 10 m mesh cannot show anyway.
smooth_sigma_m = 20.0
