# Circuit of the Americas (Austin, Texas): Grand Prix circuit, 5513 m, 20 turns, anticlockwise.
#
#   .venv/bin/python tools/track/build_track.py cota --offline

id = "cota"

[osm]
# type=circuit, "Circuit of the Americas": the 29 ways of the Grand Prix loop (5508 m in OSM)
# with the finish and start lines as node members. The pit lane, the two short-course links,
# the "COTA Short Track" duplicate and the kart track are not members, so nothing has to be
# excluded. (A bounding box does not work here: with the kart track and the short-course ways
# the raceway graph is too tangled to search.)
relation = 6537729

[elevation]
dataset = "terrarium"
# The default 45 m flattens the crest at Turn 1 (the apex sits on top of the hill); 25 m keeps
# the climb from the grid at its real gradient without letting DEM noise through.
smooth_sigma_m = 25.0

# The turn table is pinned. The automatic detection finds 23 lobes: it counts the two gentle
# left bends on the way into the Turn 15 hairpin, and four apexes in the long right-hander
# that is officially three turns (16, 17, 18). The unnumbered fourth apex of that
# right-hander is at s = 4707.
[[turn]]
id = "T1"
name = "Big Red"
direction = "left"
s = 659.3

[[turn]]
id = "T2"
name = "Turn 2"
direction = "right"
s = 877.8

