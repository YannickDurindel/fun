[[turn]]
id = "T14"
name = "Harmon Avenue (entry)"
direction = "left"
s = 5175.0

# Officially a right-hander between two lefts. OSM draws Turn 14 to Turn 16 as a 120 m
# diagonal between two left-hand vertices, with the Turn 15 node on the straight part; the
# [[layout.shift]] above gives the lap its right-hand kink (about 90 m radius, 12 degrees)
# where the push ends.
[[turn]]
id = "T15"
name = "Harmon Avenue (chicane)"
direction = "right"
s = 5237.0

[[turn]]
id = "T16"
name = "Harmon Avenue (exit)"
direction = "left"
s = 5312.0

[[turn]]
id = "T17"
name = "Turn 17"
direction = "left"
s = 6050.0

# ---- surroundings (begin) ----
# What stands round the lap, where OpenStreetMap is wrong or silent. Written by a scratch tool from
# tables of (place, size, source); positions given along the lap were turned into lat / lon with
# the centreline of this recipe. 'Imagery' is Esri World Imagery (0.24 m a pixel), which for the
# pit lot shows the build of a race week with stands and walls in place. Heights marked 'estimate'
# come from floor counts or from photographs, not from a survey.
# Fronts keep 6.5 m or more from the road edge: the wall stands at 2.5 m and the floodlight masts
# at 5 m, and behind a tarmac run-off the wall is further out still.
[surroundings]
tree_species = "palm"     # Mexican fan palms and date palms line the Strip and the resort drives
tree_density = 60

