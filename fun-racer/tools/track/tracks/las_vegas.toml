# Las Vegas Strip Circuit, Paradise, Nevada: the Grand Prix street circuit raced since 2023
# (6201 m, 17 turns, anticlockwise).
#
#   .venv/bin/python tools/track/build_track.py las_vegas --offline
#   .venv/bin/python tools/track/landmarks/las_vegas.py
#
# The second command bakes the landmark models (Sphere, Eiffel Tower, High Roller, the palms,
# signs and fountains of the Strip, gantries, the Flamingo Road bridge, the monorail) on the
# centreline and the terrain the first one wrote: run it after every build that moves either.
# tests/test_track_las_vegas.gd fails when the two are out of step.

id = "las_vegas"

[osm]
# type=circuit relation "Las Vegas Strip Circuit". One closed loop, 6217 m in OSM: the
# purpose-built pit lot at Harmon Avenue / Koval Lane (highway=raceway), then public roads
# (Koval Lane, Westchester Drive, the service roads round the Sphere, Sands Avenue, South Las
# Vegas Boulevard, Harmon Avenue). The pit lane has the role "pit_lane"; the finish and start
# lines are node members (start 92 m after the finish line, which matches the official race
# distance: 50 laps of 6.201 km less 309.958 km = 92 m); 17 more node members carry
# junction=yes and ref = 1..17, the official turn numbers.
# The dual carriageways are mapped as two ways and the relation picks one side for each
# stretch, so the lap follows that carriageway's centreline, not the full width the race uses.
# The [[osm.round]] entries below shorten the loop to 6165 m, so the plan view is scaled up
# by 0.58 % to the official length.
relation = 16696508
ignore_oneway = true    # the oneway tags follow traffic, against the race on some roads

# The streets are drawn as road centrelines, so the lap turns at a junction on a single sharp
# vertex. These entries replace it by a corner of a plausible radius.
[[osm.round]]
node = 13341696794      # Sands Avenue: the lap changes carriageway on a 23 m raceway link,
to_node = 5717469572    # a 58 / 61 degree dogleg. Flat out in the race: an S-bend instead
reach_m = 50.0
note = "carriageway crossover on Sands Avenue between Turns 9 and 10"

[[osm.round]]
node = 12059212382      # Sphere service road -> Sands Avenue: one 90 degree vertex
reach_m = 30.0
note = "Turn 9"

[[osm.round]]
node = 12638889512      # one 77 degree vertex
reach_m = 18.0
note = "Turn 7"

[[osm.round]]
node = 12626696512      # Westchester Drive -> Sphere service road: one 36 degree vertex
reach_m = 32.0
note = "Turn 6 (entry of the long left round the Sphere)"

[[osm.round]]
node = 137743393        # Koval Lane -> Westchester Drive: one 90 degree vertex
reach_m = 34.0
note = "Turn 5"

[[osm.round]]
node = 5717585567       # pit lot -> Koval Lane: one 27 degree vertex
reach_m = 30.0
note = "Turn 4"

[[osm.round]]
node = 2852160857       # the Strip -> Harmon Avenue: one 47 degree vertex
reach_m = 15.0
note = "Turn 14"

[[osm.round]]
node = 1490596713       # Sands Avenue -> the Strip: one 71 degree vertex
reach_m = 25.0
note = "Turn 12"

# The Strip bends gently left past the Venetian, Caesars Palace and the Bellagio. OSM draws
# the bend as a polygon with 3 to 6 degree vertices, each of which becomes a 280-450 m bend a
# car at 350 km/h has to lift for; the race is flat out from Turn 12 to Turn 14.
[[osm.round]]
node = 13154585537
reach_m = 40.0
note = "the Strip"

[[osm.round]]
node = 1307215334
reach_m = 60.0
note = "the Strip"

[[osm.round]]
node = 13154585535
reach_m = 30.0
note = "the Strip (Turn 13 kink)"

[[osm.round]]
node = 4210496188
reach_m = 25.0
note = "the Strip"

[[osm.round]]
node = 1307215330
reach_m = 35.0
note = "the Strip"

[[osm.round]]
node = 6091215751
reach_m = 35.0
note = "the Strip"

[[osm.round]]
node = 13060798867
reach_m = 40.0
note = "the Strip"

[layout]
direction = "anticlockwise"

# Koval Lane is one road of five lanes, 22 m between the kerbs (measured on Esri World Imagery,
# 0.24 m a pixel). OSM draws it as two carriageways north of the Turn 4 junction and the
# relation picks the northbound one, 4 m from the east kerb: a 14 m road on that line would
# stand in the trees of the Meridian apartments. Moved 4 m west, the race surface lies against
# the east kerb and leaves a service lane on the west side (estimate: where the walls stand on
# Koval Lane is not published).
[[layout.shift]]
s = [860.0, 1540.0]
lateral_m = -4.0
blend = 80.0

# Turns 14 to 16. The official map (formula1.com circuit map) has a square left off the Strip
# (14), a right-hand kink (15) and a second left onto Harmon Avenue (16). OSM draws a straight
# diagonal between two 47 degree vertices and puts the Turn 15 node on it, so the built lap had
# no right-hander. Pushed outwards after the first vertex, the lap carries on down the Strip a
# little longer, turns in harder and then comes back to the diagonal through a right-hand
# kink. The size of the push is an estimate from the intersection's width on aerial imagery.
[[layout.shift]]
s = [5182.0, 5197.0]
lateral_m = 7.0
blend = 1.0       # the shift is rounded off over some 25 m by the build itself

[elevation]
dataset = "terrarium"
# The valley floor slopes down to the east: the Strip at Harmon Avenue is the high point, the
# Sphere the low point. Here Terrain Tiles come from the USGS 3DEP ground model, so the hotel
# towers are not in the data (range 15.3 m at the default 45 m), but 2 % ripples are; the
# long gradient is what is real.
smooth_sigma_m = 150.0

[terrain]
smooth_sigma_m = 120.0

# Widths. The only published figure is a range: "the track is around 12-15 m wide", racing
# "down one side of the Strip to keep clear of the central reservation" (formula1.com, "Las
# Vegas Grand Prix: everything you need to know"). No FIA document gives a width per section,
# so every figure below is an ESTIMATE inside that range, from the carriageway the lap uses
# measured kerb to kerb on Esri World Imagery (0.24 m a pixel, partly taken during the build
# of the 2024 race with the walls in place) less the walls that stand on the road surface.
# Banking: none anywhere; these are public roads with a drainage crossfall, which the default
# 1.5 % crossfall and the 3 % cap already describe.
[road]
base_width = 14.0     # the Strip: the four southbound lanes, 14.5 to 17 m kerb to median
grid_width = 15.0     # the permanent pit straight: 14 to 15 m wall to wall on the imagery;
                      # 15 m is also the FIA minimum for a new grid (Appendix O)

[[road.override]]     # the purpose-built hairpin: 15 to 16 m of tarmac on the imagery
s = [250.0, 470.0]
width = 15.0
blend = 40.0

[[road.override]]     # Turn 3 and Turn 4, the permanent link to Koval Lane: 13 m
s = [520.0, 800.0]
width = 13.0
blend = 40.0

[[road.override]]     # Turn 5 to Turn 9: the 9 m access road off Koval Lane, widened for the
s = [1600.0, 2310.0]  # race, and the 12 to 13 m road laid round the east side of the Sphere
width = 12.0
blend = 50.0

[[road.override]]     # Sands Avenue: one carriageway of three lanes and a turn lane, 11 to 13 m
s = [2311.0, 3200.0]
width = 12.0
blend = 40.0

[[road.override]]     # Harmon Avenue: the eastbound lanes, 14 m from the centre line to the kerb
s = [5300.0, 6000.0]
width = 13.0
blend = 50.0

# The official 17 turns, at the relation's numbered turn nodes. Automatic detection finds 18
# corners: it numbers the crossover on Sands Avenue and both curvature peaks of Turn 10, and
# has one number for the Turn 1-2 hairpin and none for Turns 13 and 15.
# The corners have no official names; these are the streets and landmarks.
[[turn]]
id = "T1"
name = "Turn 1 (hairpin)"
direction = "left"
s = 312.0

[[turn]]
id = "T2"
name = "Turn 2 (hairpin exit)"
direction = "left"
s = 352.0

