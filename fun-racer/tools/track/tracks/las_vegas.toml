name = "Koval Lane"
direction = "right"
s = 695.0

[[turn]]
id = "T5"
name = "Westchester Drive"
direction = "right"
s = 1615.0

[[turn]]
id = "T6"
name = "Sphere (entry)"
direction = "left"
s = 1889.0

[[turn]]
id = "T7"
name = "Sphere"
direction = "left"
s = 2068.0

[[turn]]
id = "T8"
name = "Sphere (chicane)"
direction = "right"
s = 2124.0

[[turn]]
id = "T9"
name = "Sands Avenue"
direction = "left"
s = 2269.0

[[turn]]
id = "T10"
name = "Sands Avenue (right)"
direction = "right"
s = 2796.0

[[turn]]
id = "T11"
name = "Sands Avenue (left)"
direction = "left"
s = 2995.0

[[turn]]
id = "T12"
name = "The Strip (entry)"
direction = "left"
