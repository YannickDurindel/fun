# Baku City Circuit, Azerbaijan Grand Prix (6003 m, 20 turns, anticlockwise).
#
#   .venv/bin/python tools/track/build_track.py baku --offline

id = "baku"

[osm]
# type=circuit relation "Baku City Circuit": 49 ways, one closed loop of 5975 m (official
# 6003 m, -0.46 %). The lap runs on public streets (Neftchilar Avenue, Pushkin, Khagani,
# Bulbul Avenue, Zarifa Aliyeva, Aziz Aliyev, Istiglaliyyat, Niyazi: ordinary highway=* ways)
# and on short highway=raceway links that draw the corners at the junctions. The relation
# already picks one carriageway of every dual carriageway, and the pit lane is not on the loop.
relation = 11266687
# The streets' oneway tags follow traffic, and no closed loop obeys them.
ignore_oneway = true

[layout]
# East along Neftchilar Avenue past the pits, then left at Turn 1.
direction = "anticlockwise"
# The relation has a "finish" and a "start" node 113 m apart. The Grand Prix runs 51 laps
# over 306.049 km, 104 m less than 51 x 6.003 km: the grid's start line is 104 m after the
# timing line, so the finish stays at the OSM node and the start goes 104 m after it.
start_offset_m = 104.0

[elevation]
dataset = "terrarium"
# A city: the elevation data is a surface model, so every block of buildings is a hill
# (35 m range and 13 % grades at the default 45 m; the seafront straight, which is level in
# reality, goes up and down by 6 m). The real profile is one long hill, the climb round the
# old city from Turn 7 to Turns 13-14 and the descent to Turn 16, about 1.5 km from foot to
# foot, and that survives a 200 m Gaussian.
smooth_sigma_m = 200.0

# Neftchilar Avenue is level along the shore. The surface model still shows a 3.6 m hump of
# buildings on the main straight; a straight line from the exit of Turn 16 to the finish line
# takes it out.
[[elevation.override]]
s = [4230.0, 5990.0]
straighten = true

# From Turn 6 to Turn 7 the lap runs on the avenue's other carriageway, 10 m beside the main
# straight (s = 4730 to 5090). The smoothing along the lap drags the heights of the streets
# before and after it into this stretch, which left it 1.3 to 3 m above the main straight:
# two halves of one avenue with a step between them. Level it and bring it down to the main
# straight's height; the ramps reach back to Turn 5 and forward into the climb after Turn 7.
[[elevation.override]]
s = [2130.0, 2540.0]
straighten = true
offset = -3.2
blend = 130.0

[terrain]
# The same building noise around the lap. The slope of the city (rising inland from the
# Caspian shore) is far longer than this and stays.
smooth_sigma_m = 120.0

[road]
# Widths. Two figures are published for the circuit: 13 m at its widest and 7.6 m at its
# narrowest, Turn 8 (the circuit's own fact sheet, repeated by formula1.com's circuit guide and
# en.wikipedia.org/wiki/Baku_City_Circuit: "narrow uphill section ... 7.6 m wide"). Nothing is
# published per street and OpenStreetMap has no width tag on the lap, but it has the lane
# count of every street of the lap (see the table below): the widths between the two figures
# are ESTIMATES of 3.5 m a lane, the Baku lane, less the strip the walls take on each side.
# The corners themselves are junctions, wider than the streets that meet there: they keep the
# base width.
base_width = 11.0
# The grid is on the four-lane seaward carriageway of Neftchilar Avenue: the 13 m maximum.
grid_width = 13.0
# Narrower than the nominal 13 m of track.json, so the drivers must be told.
track_json_widths = true

# The two carriageways of Neftchilar Avenue: Turn 6 to Turn 7 runs west on the inland one, the
# flat-out run to the line comes back east on the seaward one, and during the race one
# concrete wall with a debris fence separates the two (FIA event notes 2024: "the concrete
# wall separating the straights between Turn 6 and Turn 7 [...] replaced"; planetf1.com,
# "FIA reveal 16 changes to bonkers Baku track").
# OSM draws the two centrelines only 9.5 to 11.7 m apart, which left room for two 8 m roads.
# The carriageways are tagged lanes = 3 and lanes = 4 in OSM: 11 m (the base width) for the
# Turn 6 to Turn 7 road and 12 m for the main straight are estimates from those lane counts
# (3.5 m a lane, less the set-back of the walls), not surveyed widths. With 2.5 m for the
# median that the wall stands on (estimate) the centrelines are 5.5 + 2.5 + 6.0 = 14 m apart.
[[road.pair]]
a = [2175.0, 2530.0]
b = [4725.0, 5085.0]
separation = 14.0
gap = 2.0
blend = 40.0
note = "Turn 6 to Turn 7 beside the main straight: one wall between them"

# Street by street, in lap order. Lane counts: OSM `lanes` of the ways of relation 11266687.
[[road.override]]
s = [5060.0, 290.0]     # Neftchilar Avenue from the end of the shared stretch to Turn 1
width = 13.0
blend = 60.0
note = "main straight past the pits: lanes = 4, the published 13 m maximum"

[[road.override]]
s = [350.0, 640.0]      # Pushkin Street, past the east front of Government House
width = 12.0
blend = 30.0
note = "Turn 1 to Turn 2: lanes = 5 over both directions, the race uses one side of it (estimate)"

[[road.override]]
s = [700.0, 1505.0]     # Khagani Street
width = 10.0
blend = 30.0
note = "Turn 2 to Turn 3: lanes = 2 and a parking strip on both sides (estimate)"

[[road.override]]
s = [1565.0, 1730.0]    # Bulbul Avenue
width = 10.5
blend = 25.0
note = "Turn 3 to Turn 4: lanes = 3 (estimate)"

[[road.override]]
s = [1795.0, 2050.0]    # Zarifa Aliyeva Street
width = 10.5
blend = 25.0
note = "Turn 4 to Turn 5: lanes = 3 (estimate)"

[[road.override]]
s = [2590.0, 2950.0]    # Aziz Aliyev street up to the walls, and round to Istiglaliyyat
width = 9.0
blend = 40.0
note = "narrow streets from the exit of Turn 7 to the exit of Turn 12 (estimate)"

[[road.override]]
s = [2735.0, 2815.0]    # Turns 8 to 10 between the old city wall and the buildings
width = 7.6
blend = 25.0
note = "the castle section: 7.6 m at its narrowest (published)"

[[road.override]]
s = [3030.0, 3270.0]    # Istiglaliyyat Street, the climb past the old city's north wall
width = 12.0
blend = 40.0
note = "Turn 12 to Turn 13: lanes = 4 (estimate)"

[[road.override]]
s = [3570.0, 3740.0]    # Istiglaliyyat Street past the Philharmonic garden
width = 12.0
blend = 30.0
note = "Turn 14 to Turn 15: lanes = 4 (estimate)"

[[road.override]]
s = [3795.0, 4085.0]    # Niyazi Street, the descent to Azneft Square
width = 10.0
blend = 30.0
note = "Turn 15 to Turn 16: lanes = 2 and the tram-era margins (estimate)"

[[road.override]]
s = [4170.0, 5060.0]    # Neftchilar Avenue from Azneft Square to the end of the shared stretch
width = 12.0
blend = 40.0
note = "run to the line, beside the Turn 6 to Turn 7 stretch and before it: lanes = 3 to 4 (estimate)"

# Banking: none. The lap is on crowned city streets and no figure is published; the
# cross-section is the pipeline's automatic camber (at most 3 %, towards the inside).

# The 20 official turns. The automatic detection finds exactly these 20 (and four flat-out
