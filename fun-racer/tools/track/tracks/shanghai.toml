# Shanghai International Circuit, Grand Prix layout (5451 m, 16 turns, clockwise).
#
#   .venv/bin/python tools/track/build_track.py shanghai --offline

id = "shanghai"

[osm]
# type=circuit relation: one way for the whole lap (156328670), the pit lane by member role,
# and one node with the role "start" in front of the middle of the pit building.
relation = 2094941

[layout]
# The way has no oneway tag. Heading west along the pit straight into the right-hand snail
# (turns 1-2) is clockwise.
direction = "clockwise"
# OSM only has a "start" node. The Grand Prix runs 56 laps over 305.066 km, 190 m less than
# 56 x 5.451 km: the timing line is 190 m before the grid's start line. So the finish line is
# put 190 m before the OSM node, and the grid stays at the node.
finish = [31.33771, 121.22255]
start_offset_m = 190.0

# Turn 14: OSM draws the hairpin with a 10 m radius, which is the line along the inside
# kerb. On Esri World Imagery the tarmac there is about 18 m wide between an inside kerb of
# 3 m radius and an outer edge of 21 m, so its middle turns on 12 m: the apex is moved 2.5 m
# to the outside (left), which also leaves room for the real width.
[[layout.shift]]
s = [4797.0, 4827.0]
lateral_m = -2.5
blend = 30.0
note = "turn 14 hairpin: middle of the tarmac instead of the inside kerb"

[elevation]
dataset = "terrarium"
# Reclaimed marshland: every metre of height on the lap was built with the circuit in
# 2003-04 (40,000 piles under a polystyrene fill; FIA media kit, Chinese Grand Prix 2026).
# The DEM is flat land with a few metres of noise (SRTM was flown in 2000, before the
# circuit existed) and even puts the snail of turns 1-3 at the LOWEST point of the lap, where
# the real one is the highest. So the profile is smoothed hard and then pinned all round the
# lap with the keys below.
smooth_sigma_m = 120.0

# Sourced figures:
#   * "The high point at Turn 2 is just 7.4 m higher than the low of the long back straight"
#     (formula1.com, "Highs and lows - which F1 track has the most elevation changes?").
#   * "Maximum uphill slope: 3 %. Maximum downhill slope: 8 %" (FIA media kit 2026; the same
#     on tilke.de, "Max. Rise & Fall: 3 % | 8 %").
#   * The climb is the approach and first half of turn 1, the crest is in the middle of the
#     turn 1-2 spiral (the corner goes blind there) and the 8 % fall is the drop from turn 2
#     to the turn 3 hairpin (lap guides and onboard laps).
# The keys follow one monotone curve from each to the next (join), with zero slope at the
# crest and in the dip, so the steepest point of a ramp is 1.5 x its mean slope:
#   climb  0.0 -> +5.9 m over 295 m = 2.0 % mean, 3.0 % at its steepest;
#   fall  +5.9 -> -0.6 m over 122 m = 5.3 % mean, 8.0 % at its steepest.
# Everything else is an ESTIMATE: no survey of the rest of the lap is published. The plain
# is given gentle sub-metre drifts in the direction the smoothed DEM has them, with the
# lowest point (-1.5 m) put on the back straight as the source says.
[[elevation.key]]
s = 0.0
y = 0.0
join = true
note = "finish line"

[[elevation.key]]
s = 495.0
y = 0.0
join = true
note = "foot of the climb, braking for turn 1 (pit straight level: estimate)"

[[elevation.key]]
s = 790.0
y = 5.9
join = true
note = "crest before the turn 2 apex: highest point, 7.4 m above the back-straight low"

[[elevation.key]]
s = 912.0
y = -0.6
join = true
note = "dip before the turn 3 apex, foot of the 8 % fall (height: estimate)"

[[elevation.key]]
s = 1024.0
y = -0.3
join = true
note = "turn 4 (estimate)"

[[elevation.key]]
s = 1350.0
y = 0.2
join = true
note = "turn 5 kink (estimate)"

[[elevation.key]]
s = 1600.0
y = -0.4
join = true
note = "turn 6 hairpin, braking slightly downhill (estimate)"

[[elevation.key]]
s = 2000.0
y = -0.9
join = true
note = "turn 7 (estimate)"

[[elevation.key]]
s = 2390.0
y = -0.7
join = true
note = "turn 8 (estimate)"

[[elevation.key]]
s = 2670.0
y = -0.9
join = true
note = "turn 10 (estimate)"

[[elevation.key]]
s = 3150.0
y = -1.2
join = true
note = "turn 11 (estimate)"

[[elevation.key]]
s = 3414.0
y = -1.0
join = true
note = "turn 13 (estimate)"

[[elevation.key]]
s = 4300.0
y = -1.5
join = true
note = "low point of the lap, on the back straight (position along it: estimate)"

[[elevation.key]]
s = 4812.0
y = -1.2
join = true
note = "turn 14 hairpin (estimate)"

[[elevation.key]]
s = 5185.0
y = -0.3
join = true
note = "turn 16 (estimate)"

[road]
# "Track width: 13-15 m" (tilke.de, the designer's data sheet). No per-section table is
# published, so the sections were MEASURED on Esri World Imagery (0.3 m pixels, kerb to
# white line, good to about +/- 0.6 m): 14.2-15.0 m on the pit straight, 14.3-15.2 m on the
# back straight, 13.3-14.5 m everywhere else (most readings 14.0), and the three hairpins
# opened out at the apex: about 16 m at turn 6, 15 m at turn 11 and 18 m at turn 14 ("a
# hairpin that's good for overtaking as it's unusually wide", FIA media kit 2026).
base_width = 14.0
grid_width = 15.0

[[road.override]]
s = [5235.0, 480.0]
width = 15.0
blend = 40.0
note = "pit straight, turn 16 exit to the turn 1 braking zone (measured 14.2-15.0 m)"

[[road.override]]
s = [1080.0, 1300.0]
width = 13.5
blend = 40.0
note = "turn 4 to turn 5 (measured 13.2-13.3 m)"

[[road.override]]
s = [1585.0, 1615.0]
width = 16.0
blend = 30.0
note = "turn 6 hairpin apex (measured about 16 m)"

[[road.override]]
s = [1980.0, 2230.0]
width = 13.5
blend = 40.0
note = "turn 7 and the change of direction to turn 8 (measured 13.3 m)"

[[road.override]]
s = [3140.0, 3165.0]
width = 15.0
blend = 25.0
note = "turn 11 apex (measured about 15 m)"

[[road.override]]
s = [3640.0, 4760.0]
width = 15.0
blend = 60.0
note = "back straight (measured 14.3-15.2 m)"

[[road.override]]
s = [4797.0, 4827.0]
width = 18.0
blend = 30.0
note = "turn 14 hairpin apex (measured about 18 m)"

# Banking. The FIA media kit speaks of "the gentle banking at the ever tightening opening
# sequence of corners", and turn 13 is banked the same way onto the back straight; no angle
# is published anywhere I could find. The pipeline caps
# bank at 0.03 rad (1.7 degrees), so both get the cap over their whole length instead of
# only at the curvature peak. + = left edge higher (right-handers).
[[road.override]]
s = [560.0, 850.0]
bank = 0.03
blend = 40.0
note = "turns 1-2, banked spiral (real figure higher than the cap)"

[[road.override]]
s = [3300.0, 3560.0]
bank = 0.03
blend = 40.0
note = "turn 13, banked (real figure higher than the cap)"

[terrain]
# Same reason as the road: without this the DEM noise shows as rolling hills on a plain.
smooth_sigma_m = 150.0

# All 16 official turns, pinned: the automatic detection sees each snail (1-2-3-4 and
