# Surroundings. The rings below are printed by tools/track/landmarks/shanghai.py --recipe
# (which also builds the landmark models), so stands and models share one set of measures.
[surroundings]
# Untagged buildings inside the venue are single-storey service blocks (toilets, marshals'
# stores, kart-track sheds): 4 m instead of the two-storey default.
default_levels = 1
level_height_m = 4.0
# Reclaimed marsh with planted rows of camphor trees and willows: no conifers.
tree_species = "broadleaved"

# The map has the main complex and stands H and K in 3D building parts with heights (wings
# 24.5-35 m, grandstand roof from 29.75 m, canopies with rims at 19 and 23.5 m on masts of
# 29 and 33 m). The step can only build such parts as boxes and flat discs on four posts,
# and the outlines they belong to as seating cut off at the road. So the outlines and those
# parts are excluded here; plain seating is added below and the wings, the roof and the
# canopies are landmark models with the map's own measures. The glass towers under the
# wings, the red stair drums and the pit building stay as the map has them.
[[surroundings.exclude]]
osm = "way/107371135"
note = "A看台: main grandstand + wings in one outline"

[[surroundings.exclude]]
osm = "way/1372574254"
note = "seating slab of the main grandstand (a 24.5 m box)"

[[surroundings.exclude]]
