# Fuji Speedway (Oyama, Shizuoka, Japan): the full Grand Prix course as raced in the WEC
# "6 Hours of Fuji", with the Dunlop chicane / final sector, 4563 m, 16 turns, clockwise.
# Endurance series (calendar_endurance.json).
#
#   .venv/bin/python tools/track/build_track.py fuji --plot

id = "fuji"
series = "endurance"
full_name = "Fuji Speedway (Grand Prix course)"

[osm]
# No type=circuit relation (only the venue way 196330118, leisure=sports_centre). The box
# holds the main loop (way 148622740), pit lane, short circuit, drift course and karting.
bbox = [138.915, 35.363, 138.945, 35.380]

[layout]
direction = "clockwise"
# OSM has no start / finish node. Estimate: the pit-straight grandstand stands about 600 m
# before the Turn 1 braking zone, i.e. roughly 120 m past the middle of the 1.5 km straight
# (where the build would put it). Not verified against aerial imagery.
finish = [35.372777, 138.927778]

[elevation]
dataset = "terrarium"
# Elevation: the terrarium DEM gives a 52 m range against about 40 m published. Pinning the
# lowest point (s = 2617) and the foot of 100R with [[elevation.key]] was tried and made the
# autopilot leave the road at T9 (s = 2760), so the DEM profile is kept; estimate left as is.

[road]
# The course is 15 m wide all round (circuit data sheet; Wikipedia gives 15 m). The default 13 m
# came from the generic base width.
base_width = 15.0
grid_width = 15.0

# Official numbering (16 turns). The names are the usual ones; the detector's numbering matches
# the published layout on these. Names of the final-sector corners are not pinned (unverified).
[[turn]]
id = "T1"
name = "TGR corner"
[[turn]]
id = "T3"
name = "Coca-Cola corner"
[[turn]]
id = "T4"
name = "100R"
[[turn]]
id = "T6"
name = "Hairpin"
[[turn]]
id = "T8"
name = "300R"
[[turn]]
id = "T9"
name = "Dunlop corner"
