# Bahrain International Circuit, Sakhir: the Grand Prix layout (5412 m, 15 turns, clockwise).
#
#   .venv/bin/python tools/track/build_track.py bahrain --offline

id = "bahrain"

[osm]
# type=circuit "Bahrain Grand Prix Circuit": exactly the three ways of the Grand Prix lap
# (4818385, 881756729, 881756728). The venue's other layouts (Outer, Endurance, Inner,
# Paddock, Flat Oval, the drag strip and the kart track) and the pit lane are separate ways
# that are not members, so nothing has to be excluded.
relation = 284538

[layout]
# OSM has no start / finish nodes here. The lines are derived from two published figures,
# not surveyed:
#   - Formula 1 gives 353 m from pole position to the Turn 1 braking point; with about
#     120 m from there to the apex, the start line is about 475 m before the T1 apex.
#   - The race distance (57 laps, 308.238 km = 57 x 5.412 km - 0.246 km) means the first lap
#     is 246 m short: the finish line is 246 m BEFORE the start line, the largest offset on
#     the calendar. The point 246 m before the start line lies 5 m from the painted line seen
#     across the pit straight in aerial imagery (Esri World Imagery), level with the south
#     end of the pit building.
finish = [26.030439, 50.510406]
start = [26.032639, 50.510498]

[elevation]
dataset = "terrarium"

# Only the first corner has an official name; the others are known by their numbers.
[[turn]]
id = "T1"
name = "Michael Schumacher"

[[turn]]
id = "T2"
name = "Turn 2"

[[turn]]
id = "T3"
name = "Turn 3"

[[turn]]
id = "T4"
name = "Turn 4"

[[turn]]
id = "T5"
name = "Turn 5"

[[turn]]
id = "T6"
name = "Turn 6"

[[turn]]
id = "T7"
name = "Turn 7"

[[turn]]
id = "T8"
name = "Turn 8"

[[turn]]
id = "T9"
name = "Turn 9"

[[turn]]
id = "T10"
name = "Turn 10"

[[turn]]
id = "T11"
name = "Turn 11"

[[turn]]
id = "T12"
name = "Turn 12"

[[turn]]
id = "T13"
name = "Turn 13"

[[turn]]
id = "T14"
name = "Turn 14"

[[turn]]
id = "T15"
name = "Turn 15"

# ---------------------------------------------------------------------------------------------
# Size
#
# Elevation. Published: "relief ranges from 0 to 18 m" (the circuit's 2004 data sheet, quoted
# by oversteer48.com), 17 m (f1-fansite.com); maximum gradients 3.6 % up and 5.6 % down
# (tilke.de, portfolio page of the circuit). The Terrain Tiles profile has the right shape
# (lowest on the pit straight, a crest between Turn 4 and Turn 5, the highest point before
# Turn 13) but a range of 21.2 m: a 30 m surface model is good to about 3 m here. The two
# hilltops are pinned 2.3 m and 3.2 m lower (24.6 m above sea level, the old finish line at
# 8.57 m + 16 m), which gives the published 18 m. Which of the DEM's
# heights carry the excess is not known: taking it off the crests is an estimate.
[[elevation.key]]
s = 1693.6
abs = 24.6
blend = 350.0
note = "crest between Turn 4 and Turn 5 (DEM: +18.3 m)"

[[elevation.key]]
s = 4010.6
abs = 24.6
blend = 350.0
note = "highest point of the lap, before Turn 13 (DEM: +19.2 m)"

[road]
# Width. Published: 14 m to 22 m (tilke.de: "track width 14 m - 22 m"); Mercedes' 2023 race
# preview notes that the width varies at the end of the straights. No source gives it per
# section, so the table is measured on aerial imagery (Esri World Imagery, 0.54 m per pixel,
# white line to white line, good to about 1.5 m): 14 m everywhere, 15 m on the pit straight,
# and Tilke's widened braking zones and apexes at Turn 1 (21 m), Turn 4 (21 m), Turn 8 (18 m),
# Turn 11 (16 m), Turn 13 (18 m) and Turn 14 (18 m).
# [s (m), width (m), note], smoothstep-interpolated, cyclic.
width_keys = [
  [0.0, 15.0, "finish line, on the pit straight"],
  [493.6, 15.0, "start line and grid"],
  [603.6, 15.0, "braking for Turn 1: the road starts to open"],
  [668.6, 21.0, "Turn 1 turn-in"],
  [738.6, 21.0, "Turn 1 apex and exit"],
  [793.6, 14.0, "Turn 2"],
  [1333.6, 14.0, "straight to Turn 4"],
  [1433.6, 20.0, "braking for Turn 4"],
  [1493.6, 21.0, "Turn 4"],
  [1558.6, 21.0, "Turn 4 exit"],
  [1653.6, 16.0, "run down to Turn 5"],
  [1743.6, 14.0, "Turn 5"],
  [2183.6, 14.0, "braking for Turn 8"],
  [2233.6, 18.0, "Turn 8 hairpin"],
  [2293.6, 18.0, "Turn 8 exit"],
  [2353.6, 14.0, "towards Turn 9"],
  [3393.6, 14.0, "end of the Turn 10 to Turn 11 straight"],
  [3428.6, 16.0, "Turn 11"],
  [3553.6, 16.0, "Turn 11 exit"],
  [3603.6, 14.0, "climb to Turn 12"],
  [4013.6, 14.0, "braking for Turn 13"],
  [4058.6, 18.0, "Turn 13"],
  [4153.6, 18.0, "Turn 13 exit"],
  [4213.6, 14.0, "back straight"],
  [4853.6, 14.0, "braking for Turn 14"],
  [4893.6, 18.0, "Turn 14"],
  [4943.6, 18.0, "Turn 14 exit"],
  [4993.6, 14.0, "Turn 15"],
  [5053.6, 15.0, "pit straight"],
]

# Banking. The circuit has none: every corner is flat or nearly so, and the automatic camber
# (proportional to curvature, at most 0.03 rad) stands. The one exception that the lap guides
# all name is Turn 10, "downhill and off-camber" (formula1.com circuit guide), which is why
# the inside front locks there. No angle is published: 0.01 rad (0.6 degrees) falling to the
# outside is an estimate.
[[road.override]]
s = [2705.6, 2749.6]
bank = 0.01
blend = 35.0
note = "Turn 10: off-camber left-hander (the left edge is the inside, and it is the higher one)"

# ---------------------------------------------------------------------------------------------
# Surroundings
#
# The site is desert: bare sand and limestone everywhere, a few irrigated lawns round the
# paddock, the tower and Turn 1 to Turn 3, date palms in rows. In this track's palette
# (assets/tracks/bahrain/environment.json) the land-cover classes therefore mean:
#   grass    = bare desert ground (the class of everything the map says nothing about)
#   sand     = the sand of the infield and the run-off surrounds
#   farmland = irrigated lawn (the [[surroundings.add]] list at the end of this file)
#   forest   = palm grove on lawn
#   paved    = tarmac: car parks, roads, run-off beyond the 30 m verge
#   (the painted run-off, blue and white artwork, is paved: no class has its colours)
# Reference: Esri World Imagery; the SkySat image of 2 November 2017 and the photographs of
# the circuit on Wikimedia Commons.
[surroundings]
# The map's woods and the groves added below are date palms.
tree_species = "palm"

