# Full paved width between the outer edges of the white lines. Suzuka publishes only the range
# (10 to 16 m in the 2019 Super Formula data sheet, 10 to 14 m on Honda's older circuit page);
# the table is measured on the GSI seamless orthophoto (0.49 m per pixel), dark tarmac between
# the edge lines every 10 m of the lap, checked by hand at s = 330 (14.0 m), 1160 (10.1 m),
# 2700 (8.9 m) and 4600 (9.6 m). Good to about half a metre: estimates, not survey figures.
# The grid and the pit straight could not be measured between s = 0 and 270 (the shadow of the
# pit building lies on them) and take the width of the straight either side.
