# Banking: Suzuka has no banked corner and publishes no camber figures, so the automatic
# camber (2.5 % at a 100 m radius, capped at 3 %) is kept, except at Gyaku Bank ("reverse
# bank"): ja.wikipedia (鈴鹿サーキット) says it has no cant at all, which is what makes it feel
# reversed after the cambered S Curves.
[[road.override]]
s = [1450.0, 1600.0]
bank = 0.0
blend = 40.0

[surroundings]
