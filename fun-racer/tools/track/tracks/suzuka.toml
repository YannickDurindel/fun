id = "suzuka"

[osm]
# type=circuit relation "Suzuka International Racing Course": the Grand Prix loop plus the pit
# lane (role pit_lane, dropped automatically). Suzuka is a figure of eight: the bridge way
# (175231434, bridge=yes, layer=1) shares no node with the road under it, so the loop search
# finds one simple loop of 5811 m.
relation = 284570

[layout]
# OSM has no start / finish nodes. The timing line is at the beginning of the pit building,
# about 205 m along the main straight way (183391665); the grid's start line is 300 m after it,
# at the first-corner end of the pit building (the Grand Prix distance is 53 laps minus
# 0.300 km). Both are placed from the pit building's outline in OSM, not from a tagged line.
finish = [34.844698, 136.538928]
start_offset_m = 300.0

# The map draws the run from Dunlop down to Degner 1 about 3 m to the right of the road
# (measured on the GSI seamless orthophoto, 0.49 m per pixel: tarmac from 7.3 m left to 1.0 m
# right of the mapped line all the way from s = 2100 to 2250; everywhere else the line is
# within 1.5 m of the middle of the road).
[[layout.shift]]
s = [2095.0, 2255.0]
lateral_m = -3.0
blend = 40.0

[elevation]
dataset = "terrarium"

# The road's heights are pinned every 50 m to the Geospatial Information Authority of Japan's
# 5 m airborne-laser ground model (GSI elevation API, cyberjapandata2.gsi.go.jp, source
# "5m (laser)", read at the centreline in October 2026; heights are metres above the timing
# line, which the model has at 37.3 m above sea level). Terrain Tiles are a 30 m surface model
# here and put the lap up to 6 m off: First and Second Curve too high (the lowest point of the
# lap is the Second Curve, not the exit of it), the hairpin, Spoon and the back straight 3 to
# 6 m too high (tree tops). What the laser model gives:
#   * elevation range 40.6 m (Suzuka's published figure is 40.4 m; the Japanese Wikipedia's
#     52 m does not fit any ground model);
#   * main straight a steady 2.8 % down to First Curve (Takenaka, builder of the 2009
#     grandstand: "2.8 percent downward pitch toward the first corner");
#   * Dunlop 7.3 % average over 100 m (ja.wikipedia: 7.8 %, the steepest climb of the lap);
#   * 6.2 m between the two road surfaces at the crossover, which replaces the 6.8 m this
#     recipe used to set by hand with [[elevation.override]] entries.
# Keys this close together (under key_join_m) are joined into one curve, so the profile
# between them is the laser model's and nothing of the tile profile is left.
