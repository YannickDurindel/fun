[[surroundings.exclude]]    # main grandstand 1
osm = "way/377679571"
[[surroundings.exclude]]    # main grandstand 2
osm = "way/377679572"
[[surroundings.exclude]]    # main grandstand, the block beside the Peraltada exit
osm = "way/736211980"
[[surroundings.exclude]]    # grandstand outside Turns 5 and 6, mapped as a plain building
osm = "way/1309442839"
[[surroundings.exclude]]    # Palacio de los Deportes
