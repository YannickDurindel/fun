# Autódromo Hermanos Rodríguez, Mexico City: the Grand Prix circuit with the Foro Sol stadium
# section (4304 m, 17 turns, clockwise).
#
#   .venv/bin/python tools/track/build_track.py hermanos_rodriguez --offline

id = "hermanos_rodriguez"

[osm]
# type=circuit "Mexican Grand Prix": exactly the Grand Prix loop (4317 m in OSM), without the
# full Peraltada, the oval or the Formula E pieces that a bounding box would also bring in.
relation = 16251935

[layout]
# The relation gives the finish line, 45 m after the Peraltada exit, and a start line 134 m
# after it. The official race distance (305.354 km for 71 laps of 4.304 km) puts the start
# line 230 m after the finish line, so the grid goes there.
start_offset_m = 230.0

# OSM draws the main straight along the pit wall side of the tarmac. Measured on aerial
# imagery (Esri World Imagery, 0.25 m per pixel, tarmac edge to tarmac edge across the
# OSM line): the middle of the road is 2.4 to 3.2 m left of it beside the pit building and
# 0.9 to 2.1 m left from the pit exit to Turn 1. Everywhere else the line is within a
# metre of the middle. Two shifts that add up: 1.3 m all along, 1.6 m more beside the pits.
[[layout.shift]]
s = [4240.0, 1150.0]
lateral_m = -1.3
blend = 60.0

[[layout.shift]]
s = [4250.0, 340.0]
lateral_m = -1.6
blend = 60.0

[elevation]
dataset = "terrarium"
# The site is flat (a few metres over the lap) and in a city: grandstands, the stadium and
# trees leak into the surface model. Smooth heavily so the lap stays flat.
smooth_sigma_m = 300.0

[terrain]
# Same reason: unsmoothed, the Palacio de los Deportes is a 27 m grass hill beside the
# Peraltada and every block of houses a bump.
smooth_sigma_m = 200.0

[road]
# No width is published per section (the FIA circuit licence and the promoter's pages only
# give the length), and the loop's OSM ways carry no width tag. All widths below are
# estimates measured on aerial imagery (Esri World Imagery, 0.25 m per pixel), tarmac edge
# to tarmac edge inside the white lines, every 200 m of the lap, good to about half a metre:
#   12 m      the 1959 road, which is most of the lap: 11.6 to 12.5 m from the pit exit to
#             Turn 1, through the Ese Moisés Solana, down the back straight, the Ese del
#             Lago, the Horquilla and the Eses (the FIA minimum for a permanent circuit);
#   15 m      the Peraltada half that is still used and the pit straight (14.4 to 15.9 m,
#             the 15 m the FIA asks of a starting grid), back to 12 m by the pit exit;
#   14 m      the run to the stadium on the old oval's front straight (14.4 m at s = 3500);
#   14 m      inside the Foro Sol, between the painted lines on the stadium floor.
base_width = 12.0
grid_width = 15.0

[[road.override]]
s = [4035.0, 345.0]
width = 15.0
blend = 50.0

[[road.override]]
s = [3440.0, 3640.0]
width = 14.0
blend = 30.0

[[road.override]]
s = [3765.0, 3985.0]
width = 14.0
blend = 20.0

# The Peraltada was banked at 10 degrees until it was eased in 1992 (Ferrari's 2021 race
# preview; RaceFans circuit guide); no figure is published for what is left, which on board
# still shows clearly more than a crossfall. The pipeline caps banking at 0.03 rad
# (1.7 degrees), so the half of it the lap uses gets the cap all the way round.
[[road.override]]
s = [4085.0, 4235.0]
bank = 0.03
blend = 40.0

# Official numbering. The automatic detection finds these 17 plus two flat-out bends
