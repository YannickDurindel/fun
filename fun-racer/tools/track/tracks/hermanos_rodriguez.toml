# ---------------------------------------------------------------------------------------
# Surroundings. The circuit lies in the Magdalena Mixhuca sports city, an island of sports
# fields, halls and trees in the middle of dense Mexico City. Reference for everything
# below: aerial imagery (Esri World Imagery, 0.25 m per pixel, taken with a music festival
# on the infield, so anything temporary in it was ignored), the map itself, the race's
# seating plan and trackside photographs. Heights are estimates unless a source is named:
# counted seat rows and storeys, shadow lengths.
# ---------------------------------------------------------------------------------------
[surroundings]
# Untagged woods here are ash, eucalyptus, jacaranda and casuarina: broadleaved.
tree_species = "broadleaved"
tree_density = 70

# Built by tools/track/landmarks/hermanos_rodriguez.py instead (see there): the Foro Sol
# with its roof and the passage the track takes through its west stand, the pit building,
# the covered grandstands, the Palacio de los Deportes and the velodrome.
[[surroundings.exclude]]    # Foro Sol, north arm
osm = "way/377679562"
[[surroundings.exclude]]    # Foro Sol, south arm and west stand
osm = "way/1315400018"
[[surroundings.exclude]]    # Foro Sol, the stand over the track
osm = "way/1315400019"
[[surroundings.exclude]]    # pit building ("Paddock")
