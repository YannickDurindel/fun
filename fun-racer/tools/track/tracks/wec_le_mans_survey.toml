# Circuit de la Sarthe, survey variant: the same lap as wec_le_mans (copy of its recipe) with
# heights from IGN's RGE ALTI (1-5 m terrain model, Licence Ouverte 2.0) instead of Terrain
# Tiles. Not in calendar_endurance.json, so the recipe carries the card data itself. The IGN
# LiDAR HD / ortho cache for the later survey work is listed in raw/ign_manifest.json.
#
#   .venv/bin/python tools/track/build_track.py wec_le_mans_survey --plot

id = "wec_le_mans_survey"
series = "endurance"
name = "Circuit de la Sarthe"
grand_prix = "24 Hours of Le Mans (Survey)"
country = "France"
country_code = "FR"
city = "Le Mans"
length_m = 13626
turns = 38
full_name = "Circuit de la Sarthe (24 Hours layout, IGN survey elevation)"

[osm]
# No 24 Hours relation (relation 2725877 is only the Bugatti circuit). The lap is chained by
# hand, in driving order, from the raceway ways (Bugatti part, chicanes, Mulsanne, Arnage,
# Porsche, Ford) and the D338 / D140 / D139 highway ways between them (found with a shortest-path
# search over the OSM graph; the chain is 13627 m against 13626 m official).
ignore_oneway = true
ways = [
  773623628, 1101935455,                 # Courbe Dunlop
  773623626, 773623627,                  # Chicane Dunlop and the way to La Chapelle
  1101935457, 34405868,                  # La Chapelle
  226901643, 226901631,                  # Esses de la Foret, Tertre Rouge
  624045670, 624045671,                  # exit of Tertre Rouge onto the Hunaudieres
  158840041, 255699444, 159588882,       # D338 Mulsanne straight (one carriageway, northbound way reversed)
  1358131505, 34405892,                  # first chicane (Daytona / Forza)
  25245509, 34405893, 159588880,         # straight again
  256130501,                             # Chicane Michelin (Playstation)
  1505387925, 158840027, 1505387926,     # D338 to Mulsanne
  256130500,                             # Virage de Mulsanne
  1494893860, 1505387934, 1505387935,    # D140 Route du Golf
  121230938, 1505387930, 1505387929,     # to Indianapolis
  1011729892, 231829816, 231829814,      # Virage d'Indianapolis and the way to Arnage
  1011729891,                            # Virage d'Arnage
  158840033,                             # D139 to the Porsche curves
  34405909, 1011729893,                  # Virage Porsche
  226901647, 226901650, 257319131,       # Virage du Pont, Karting, Corvette
  226901635, 226901626,                  # Maison Blanche, Chicane Ford
  226901639, 258242164,                  # Raccordement
  773623629,                             # pit straight up to the Dunlop curve
]

[layout]
# Manual ways do not take the direction from the oneway tags.
direction = "clockwise"
# No start / finish node in OSM. The Esri World Imagery aerial (z19, 0.2 m per pixel) shows the
# white line across the pit straight in front of the start gantry and the race control tower, on
# the estimate to within about 1 m (read off the picture to +/- 3 m).
finish = [47.949865, 0.207541]

[elevation]
# IGN LiDAR HD ground points (about 30 per m^2), gridded by lib/lidar.py into lidar_road.* (0.25 m,
# 40 m either side of the lap) and lidar_terrain.* (1 m, 600 m) in the track folder; the far
# terrain and the grids' holes are RGE ALTI. Rebuild the grids after the plan view changes:
#   cd tools/track && nice -n 10 ../../.venv/bin/python -m lib.lidar wec_le_mans_survey
# The centreline is sampled every 2 m (median of a 4 x 4 m footprint): cm-exact, so only a light
# smoothing. Bridges come from the class 17 points: three decks carry the lap (s ~ 2090 m after
# Tertre Rouge, ~ 2548 m at the start of the Hunaudieres, ~ 11910 m Virage du Pont), where RGE ALTI
# and the old profile dipped 4.5-5.5 m to the ground under them; the grid has the deck there, so
# no [[elevation.key]] is needed. Footbridges over the lap do not touch the road.
dataset = "lidar_hd"
smooth_sigma_m = 4.0

[road]
# Widths traced from the IGN BD ORTHO 20 cm orthophotos (lib/ortho.py -> ortho_edges.json, one
# station every 2 m: kerb inner edge / painted edge line / asphalt boundary, see its edge_rule).
# lib/ortho.road_width_keys smooths them (42 m running median, 6 m Gaussian) and they replace
# width_keys below; those stay as the ESTIMATE that takes over where the trace is uncertain
# (fewer than 30-50 % confident edges over 100 m: trees and shadow, chicane bypasses). The
# estimate is blended in on 15 stretches, 6 % of the lap, mostly 50-90 % traced still: in the
# Hunaudieres chicanes (s ~ 4505-4775 Daytona, 6235-6332 Michelin, 6448-6534) and the wooded
# D140 Route du Golf (7778-7820, 8628-8723, 9293-9545). Traced against the estimate:
#   pit straight 15.0 (15), Dunlop to Tertre Rouge 10.8 (13), D338 Hunaudieres 13.9 (12, 3 lanes
#   and the turn lanes), Mulsanne 10.6 (11.5), D140 11.6 (11), Indianapolis 12.5 (10), Arnage 12.6
#   (9.5), D139 14.3 (11), Porsche curves 9.5 (12.5, the painted blue run-off is outside),
#   Raccordement 16 (13.5).
# Re-trace after the centreline changes (track.json stations): cd tools/track &&
#   nice -n 10 ../../.venv/bin/python -m lib.ortho wec_le_mans_survey
# The finish line (s = 0) and the start line in front of the painted grid (start_s = 144 m) are
# both within 1 m of the white lines on the orthophoto (s ~ +0.8 m and ~ 144.9 m).
widths_from = "ortho_edges.json"
# Cross-sections (crown, camber) measured from the lidar road grid (cad/track/road_sections.py)
# are OFF for now: with them the simulation autopilot runs off at the Virage de Mulsanne (s ~ 7790,
# measured camber 1.1 deg falling to 0 at the exit against 1.7 deg analytic) and at Dunlop. Turn
# them back on once the autopilot's corner speeds account for the camber.
# sections = "lidar"
base_width = 13.0
grid_width = 15.0
width_keys = [
  [0.0, 15.0, "pit straight"],
  [320.0, 15.0, ""],
  [400.0, 13.0, "Dunlop curve and chicane (Bugatti circuit part)"],
  [2150.0, 13.0, "Tertre Rouge exit"],
  [2300.0, 12.0, "D338 Mulsanne straight (estimate)"],
  [7450.0, 12.0, ""],
  [7600.0, 11.5, "Virage de Mulsanne"],
  [7850.0, 11.0, "D140 Route du Golf (estimate)"],
  [9550.0, 11.0, ""],
  [9700.0, 10.0, "Indianapolis, village street (estimate)"],
  [9950.0, 10.0, ""],
  [10050.0, 9.5, "Arnage, village street (estimate)"],
  [10300.0, 10.0, ""],
  [10450.0, 11.0, "D139 towards Porsche (estimate)"],
  [11400.0, 11.0, ""],
  [11500.0, 12.5, "Porsche curves (raceway)"],
  [13300.0, 12.5, ""],
  [13450.0, 13.5, "Raccordement"],
  [13520.0, 15.0, "pit straight"],
]

# The chicanes and the slow bends: here the cars use the kerbs, which the trace leaves outside
# the edge (its edge rule stops at a kerb's inner edge), and the open asphalt of a chicane's
# bypass or a junction mouth bulges the trace (Daytona 10.2 to 17.7 m, Michelin 8.8 to 17.4 m,
# the Mulsanne junction 8.4 to 18.5 m). On those bulges and pinches the simulation car's racing
# line (opened up to its steering lock, autopilot.gd) swung wide and came back at full lock: it
# ran off at the Mulsanne exit, spun in the Daytona chicane and left the road at Dunlop. So
# through each of them the width is held at the traced width between the kerbs plus the traced
# kerbs (ortho_edges.json "kerbs", about 0.7 to 1.5 m a side), rounded:
#   Dunlop 10.8 + 1.3 + 1.2 -> 13.0 (the estimate was 13), Daytona 10.2-11 between the kerbs
#   + 0.7 + 1.1 -> 12.5 (12), Michelin 10.4 + 0.7 + 0.75 -> 12.0 (12), Mulsanne (20 m radius,
#   both edges flagged at the apex, s ~ 7738-7770) 10.6 + 1.05 -> 11.7 (11.5), Ford 10.5 + 0.9
#   + 1.4 -> 12.8 (12.5), Raccordement (18 m radius) 9.2 + 1.05 + 0.8 -> 11.1, taken 11.5 (13.5).
[[road.override]]
s = [790.0, 950.0]
width = 13.0
blend = 25.0
note = "Chicane Dunlop: traced width + kerbs"

[[road.override]]
s = [4010.0, 4280.0]
width = 12.5
blend = 25.0
note = "Chicane Daytona (Forza): traced width between the kerbs + kerbs, bypass bulges left out"

[[road.override]]
s = [5970.0, 6270.0]
width = 12.0
blend = 25.0
note = "Chicane Michelin (Playstation): traced width + kerbs, bypass bulges left out"

[[road.override]]
s = [7550.0, 7930.0]
width = 11.7
blend = 25.0
note = "Virage de Mulsanne junction: traced width + kerb (slip road mouth, island, flagged apex, and the D140 junction mouth after it, which bulges the trace to 16.6 m)"

[[road.override]]
s = [13225.0, 13335.0]
width = 12.8
blend = 25.0
note = "Chicane Ford: traced width + kerbs"

[[road.override]]
s = [13375.0, 13460.0]
width = 11.5
blend = 20.0
note = "Raccordement: traced width + kerbs"

