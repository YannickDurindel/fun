# Loudon, New Hampshire, USA: 1.058-mile flat paperclip oval (1703 m), 4 turns, anticlockwise.
# Built for the stock car / IndyCar calendars (their events link it with "track"): series
# "circuit" keeps it out of every series list on its own.
#
#   .venv/bin/python tools/track/build_track.py new_hampshire --plot

id = "new_hampshire"
series = "circuit"
name = "Loudon"
grand_prix = "Loudon"
country = "United States"
country_code = "US"
city = "Loudon"
length_m = 1703
turns = 4
full_name = "Loudon 1.058-mile oval"

[osm]
relation = 10625001   # type=circuit "... Oval": the oval without the road course infield

[layout]
direction = "anticlockwise"
# Finish line: middle of the west straight, beside the pit lane (78277613); OSM has no start / finish node.
finish = [43.363104, -71.462017]

[elevation]
dataset = "terrarium"
# An oval's racing surface is close to level all round; the DEM's few metres of tilt and noise
# (stands, the infield, the banking itself) would become a slope across the oval, so the
# profile is smoothed over most of a lap.
smooth_sigma_m = 400.0

[road]
# Real banking (New Hampshire): turns 2-7 degrees (variable, steeper at the top); 5 degrees; 1 degree. All left-handers, so
# the right (outer) edge is higher: negative bank. A full table (bank_keys, smoothstep between
# keys): the full turn angle from just inside the turn entry to just before its exit, the straight's
# own angle at the middle of each straight, so the road rolls over half a straight
# (steepest roll 0.0004 rad/m, limit 0.012). s values from the centreline (track.json).
max_bank = 0.097
# Width: 17 m.
base_width = 17.0
grid_width = 17.0
bank_keys = [
  [2.0, -0.0175, "front stretch"],
  [255.1, -0.0873, "turn 1 entry"],
  [599.5, -0.0873, "turn 2 exit"],
  [852.5, -0.0175, "backstretch"],
  [1105.7, -0.0873, "turn 3 entry"],
  [1451.8, -0.0873, "turn 4 exit"],
]

# Pinned: an oval has 4 turns (the two halves of each end), whatever the tri-oval kink does.
[[turn]]
id = "T1"
name = "Turn 1"
direction = "left"
s = 345.3

[[turn]]
id = "T2"
name = "Turn 2"
direction = "left"
s = 509.3

[[turn]]
id = "T3"
name = "Turn 3"
direction = "left"
s = 1196.4

[[turn]]
id = "T4"
name = "Turn 4"
direction = "left"
s = 1361.2

