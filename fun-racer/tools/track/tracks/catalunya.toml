[road]
# Width. Published: 12 m (MotoGP's circuit data sheet, motogp.com event page "Catalunya":
# "Width 12 m"). Measured on ICGC's 25 cm orthophoto (ortofoto_color_vigent, CC BY 4.0), white
# line to white line, +/- 0.3 m: main straight 12.3 to 12.6 m; Elf to Seat 11.7 to 11.9 m;
# Wuerth, the climb to Campsa, the back straight and the stadium 11.2 to 11.6 m; La Caixa
# (the 2021 corner) 14.4 m at the apex. The table follows the measurements; the game's
# default was 13 m with a 15 m grid.
