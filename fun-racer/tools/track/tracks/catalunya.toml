# Circuit de Barcelona-Catalunya, the Grand Prix layout used since 2023: the 2021 turn 10 and
# the two fast right-handers at the end of the lap instead of the chicane (4657 m, 14 turns).
#
#   .venv/bin/python tools/track/build_track.py catalunya --offline

id = "catalunya"

[osm]
# OSM has three type=circuit relations for the venue:
#   284540    "Circuit de Catalunya GP": the lap without the chicane (4666 m in OSM)  <- this one
#   2049529   "Circuit de Catalunya GP": the lap through the chicane (the 2021-22 layout, 4675 m)
#   21420925  "Circuit de Catalunya MotoGP": the same ways as 284540 plus the long lap penalty
# The finish and start lines are node members with the roles "finish" / "start"; the grid is
# 128 m after the timing line (the published offset is 126 m).
relation = 284540

[elevation]
dataset = "terrarium"
# The height of the road, pinned every 40 m to the lidar terrain model of the Institut
# Cartografic i Geologic de Catalunya (ICGC "MET2m", 2 m cells, ground level, CC BY 4.0;
# WMS https://geoserveis.icgc.cat/serveis/catalunya/icgc_mdt2m/wms, layer MET2m, read with
# GetFeatureInfo on the centreline every 20 m and averaged 1-2-1). y = metres above the finish
# line (120.49 m above sea level in that model).
# Why: Terrain Tiles (a 30 m surface model, smoothed over 45 m) were up to 6 m off here. They
# put a 15.5 m hump between Renault and Repsol where the road climbs steadily at 1.4 %, had
# the back straight 4 to 6 m too low, and made the climb to Campsa 8.5 % (lidar: 6.2 %).
# Lidar figures the keys reproduce: elevation range 29.7 m (commonly quoted: about 30 m, e.g. f1-fansite.com);
# lowest point the apex of Elf (-8.2 m), highest the exit of Banc Sabadell (+21.6 m); steepest
# climb +6.2 % from turn 8 to Campsa, steepest descent -6.5 % out of Seat, -5.5 % from
# Europcar to New Holland, -2.5 % at most on the main straight.
# The keys are closer together than key_join_m, so the whole lap is one curve through them.
