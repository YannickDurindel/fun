# Yas Marina Circuit, Abu Dhabi: the Grand Prix layout used since 2021 (5281 m, 16 turns,
# anticlockwise).
#
#   .venv/bin/python tools/track/build_track.py yas_marina --offline

id = "yas_marina"

[osm]
# type=circuit relation "Yas Marina Circuit": six ways of the current layout (5303 m in OSM)
# and the pit entry lane (way 176695254, named "Pit Lane", which does not close a loop).
relation = 11378665

[layout]
direction = "anticlockwise"
# OSM has no start / finish nodes. The timing line is on the pit straight shortly after the
# last corner, in front of the main grandstand; this position is an estimate (about 110 m
# after the Turn 16 apex), not a surveyed point.
finish = [24.46976, 54.60374]
# The grid is ahead of the timing line: 58 laps x 5.281 km = 306.298 km against an official
# race distance of 306.183 km, so the start line is 115 m after the finish line.
start_offset_m = 115.0

[elevation]
dataset = "terrarium"

# The official 16 turns, pinned. Automatic detection finds 17 because the long right-hander of
# Turn 3 has two curvature peaks (s = 803 and s = 901); everything else matches. Few corners
# of this circuit have names: the hairpin and the banked left-hander built in 2021 do.
[[turn]]
id = "T1"
name = "Turn 1"
direction = "left"
s = 426.6

[[turn]]
id = "T2"
name = "Turn 2"
direction = "left"
s = 677.8

[[turn]]
id = "T3"
