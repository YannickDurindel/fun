# Circuit de Spa-Francorchamps, Grand Prix layout (7004 m, clockwise, 19 turns).
#
#   .venv/bin/python tools/track/build_track.py spa --offline

id = "spa"

[osm]
# type=circuit relation of the Grand Prix layout: 30 ways, one closed loop, 7002 m in OSM.
# The pit lanes, the moto variant of Speaker's Corner and the kart track are not members.
# Its "start" node is the timing line on the straight between the chicane and La Source.
relation = 284560

[elevation]
# The terrain around the lap comes from Terrain Tiles, a surface model at 25-30 m: in the
# Ardennes spruce it reads the tree tops, so the road came out up to 11 m too high in the forest
# (a -17.4 % drop at Speaker's Corner that does not exist) and, smoothed over 45 m, 12.8 % up
# Raidillon. The road itself is therefore pinned, every 20 m, to the ground model of the
# Walloon LiDAR survey:
#   Service public de Wallonie, "Relief de la Wallonie - Modele Numerique de Terrain (MNT)
#   2021-2022", 0.5 m grid, read at the centreline through the identify operation of
#   https://geoservices.wallonie.be/arcgis/rest/services/RELIEF/WALLONIE_MNT_2021_2022/MapServer
#   (catalogue: https://geoportail.wallonie.be/catalogue/e257f5df-6c96-4118-b4d2-1e63e955df53.html)
# The road is bare ground in that model, so these are the heights of the asphalt (centre sample
# and the mean of the samples 4 m left and right agree within 0.08 m all round the lap).
# What they give, against the published figures:
#   finish line 416.56 m; La Source 423.9 m; foot of Eau Rouge 389.66 m (s = 945);
#   top of the Raidillon ramp 414.7 m (s = 1200); Les Combes / Malmedy 468.85 m, the highest
#   point (s = 2512); Bruxelles 452 m; Pouhon 395-380 m; Fagnes 377 m; Stavelot (Paul Frere)
#   366.61 m, the lowest point (s = 5034); Blanchimont 384-394 m; Bus Stop 407 m.
#   Range 102.2 m (published: 102 m / 335 ft, e.g. the lap guide at
#   oversteer48.com/spa-francorchamps-track-layout); total climb 139 m per lap.
#   Raidillon: 15.4 % at its steepest along the centreline (s = 1040-1070, 30 m chords 15.3 %),
#   25 m of climb in 240 m. The 17-18 % often quoted is not on the centreline of this survey.
#   Steepest descent 7.4 % on the run to Pouhon (8.2 % over 10 m at s = 3860 in the survey);
#   Speaker's Corner is a steady 7 %.
dataset = "terrarium"
smooth_sigma_m = 45.0
key = [
