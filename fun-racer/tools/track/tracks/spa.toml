[road]
# Full road width in metres, [s, width, note], smoothstep-interpolated, cyclic.
# No per-section widths are published for Spa (the FIA circuit file is not public, OSM has no
# width tag on the lap), so they were measured: the asphalt between the two white edge lines
# on the orthophoto of the Service public de Wallonie, summer 2023, 25 cm
# (https://geoservices.wallonie.be/arcgis/rest/services/IMAGERIE/ORTHO_2023_ETE/MapServer, i.e.
# after the 2022 rebuild), read on a profile across the centreline every 2 m, 50 m median,
# plus 0.5 m for the two lines and the blur of the photo. Good to about 0.3 m.
# The lap is far narrower than the 13 m default: 9.3 to 10 m nearly everywhere, 10.5 m on the
# Kemmel straight, 11.5 m on the approach to the chicane, and 14.7 m only on the Formula 1
# start straight. Estimates (the automatic reading fails there): La Source, where the pit
# exit joins the hairpin (measured by hand on the same photo: 18 m across at the apex), the
# stretch after Raidillon in the shadow of the trees (s = 1330-1545, interpolated) and the
# chicane itself (s = 6600-6760, by hand).
width_keys = [
  [0.0, 14.7, "Formula 1 start straight and grid"],
  [224.0, 14.7, "braking for La Source"],
  [262.0, 18.0, "T1 La Source: the hairpin opens up (estimate, by hand)"],
  [300.0, 17.0, "La Source exit, the F1 pit exit joins on the right (estimate)"],
  [335.0, 15.0, ""],
  [408.0, 12.3, ""],
  [522.0, 10.2, "end of the pit exit lane"],
  [646.0, 9.5, "descent past the endurance pits"],
  [946.0, 9.4, "T2 Eau Rouge"],
  [965.0, 10.0, "foot of Eau Rouge"],
  [987.0, 10.0, "T3 Raidillon"],
  [1187.0, 9.0, "T4 Raidillon crest: the narrowest fast part"],
