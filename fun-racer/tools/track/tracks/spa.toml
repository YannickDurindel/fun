# Circuit de Spa-Francorchamps, Grand Prix layout (7004 m, clockwise, 19 turns).
#
#   .venv/bin/python tools/track/build_track.py spa --offline

id = "spa"

[osm]
# type=circuit relation of the Grand Prix layout: 30 ways, one closed loop, 7002 m in OSM.
# The pit lanes, the moto variant of Speaker's Corner and the kart track are not members.
# Its "start" node is the timing line on the straight between the chicane and La Source.
relation = 284560

[elevation]
dataset = "terrarium"
smooth_sigma_m = 45.0

# The official numbering. The detector finds these 19 plus three flat-out bends that carry no
# number: the right kink on the descent to Eau Rouge (s = 540), the Kemmel kink (s = 1519)
# and the second half of the Stavelot right-hander (s = 5252).
[[turn]]
id = "T1"
name = "La Source"
direction = "right"
s = 276.2

[[turn]]
id = "T2"
name = "Eau Rouge"
direction = "left"
s = 938.8

