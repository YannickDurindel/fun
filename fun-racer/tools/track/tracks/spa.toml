# Bank in radians, + = left edge higher, [s, bank, note], smoothstep-interpolated, cyclic.
# Measured: the height difference between 4 m left and 4 m right of the centreline in the same
# LiDAR ground model as the heights ([elevation]), 15 m Gaussian. The pipeline limits bank to
# 0.03 rad (3 %), so every corner is cut off there; the notes give what was measured.
# The real figures, to apply when the limit goes (per cent, + = left edge higher):
#   La Source +6.6; the descent to Eau Rouge +4.8; Eau Rouge -4.8; Raidillon +6.2, its crest
